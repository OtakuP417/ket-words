<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b63f0">
<meta name="description" content="KET 单词每日背诵调度器：每天自动安排新学和复习，孩子点三档即可，进度跟随账号同步到云端。">
<title>KET 单词每日打卡</title>
<style>/* ===== KET 单词每日打卡 · 样式 ===== */

:root {
  --bg: #f3f5fb;
  --card: #ffffff;
  --card-2: #f8f9fe;
  --ink: #1a2233;
  --muted: #6b7689;
  --line: #e6eaf4;
  --brand: #4b63f0;
  --brand-2: #7a8dff;
  --red: #ef4a4a;
  --amber: #f0a13c;
  --green: #21b57d;
  --shadow: 0 10px 30px rgba(24, 40, 90, .08);
  --shadow-sm: 0 2px 8px rgba(24, 40, 90, .06);
  --radius: 22px;
  --nav-h: 66px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131722;
    --card: #1c2230;
    --card-2: #232b3c;
    --ink: #eef2fb;
    --muted: #9aa6bd;
    --line: #2b3448;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}

input, select { font-family: inherit; font-size: 16px; }

#app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
}

#view { flex: 1; padding: 20px 18px 10px; }

/* ---------- 首页 ---------- */

.hero { padding: 8px 2px 16px; }
.hero.small { padding-bottom: 10px; }
.hero-date { color: var(--muted); font-size: 14px; letter-spacing: .02em; }
.hero h1 { margin: 4px 0 6px; font-size: 30px; line-height: 1.2; letter-spacing: -.01em; }
.hero-sub { color: var(--muted); font-size: 15px; }

.tasks { display: flex; flex-direction: column; gap: 14px; }

.task {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 18px 20px 16px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
  transition: transform .12s ease, box-shadow .12s ease;
  overflow: hidden;
}
.task:active { transform: scale(.985); }
.task[disabled] { opacity: .55; box-shadow: var(--shadow-sm); }
.task-review { border-left: 6px solid var(--red); }
.task-new { border-left: 6px solid var(--brand); }

.task-line { display: flex; align-items: baseline; justify-content: space-between; }
.task-tag { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.task-num { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
.task-num small { font-size: 16px; color: var(--muted); font-weight: 500; }
.task-desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
.task-bottom { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.task-go { font-size: 14px; font-weight: 600; color: var(--brand); white-space: nowrap; }
.task-review .task-go { color: var(--red); }
.task[disabled] .task-go { color: var(--green); }
.task-bar {
  flex: 1;
  height: 8px;
  border-radius: 99px;
  background: var(--card-2);
  overflow: hidden;
}
.task-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand-2), var(--brand)); transition: width .3s ease; }
.task-review .task-bar i { background: linear-gradient(90deg, #ff8a8a, var(--red)); }

.notice {
  padding: 12px 14px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--amber) 14%, var(--card));
  color: var(--ink);
  font-size: 14px;
}

.home-foot {
  margin-top: 18px;
  padding: 16px 18px;
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.foot-progress { font-size: 15px; color: var(--muted); }
.foot-progress b { color: var(--ink); font-size: 19px; }
.done-badge { color: var(--green); font-weight: 600; }
.done-badge.big { font-size: 18px; margin: 14px 0; }

.home-links { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
.warn-line { color: var(--amber); font-size: 13px; width: 100%; }

.link-btn {
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
  font-size: 15px;
}
.pill {
  display: inline-block;
  min-width: 22px;
  padding: 0 7px;
  border-radius: 99px;
  background: var(--red);
  color: #fff;
  font-size: 12px;
  line-height: 20px;
  text-align: center;
}

/* ---------- 学习卡片 ---------- */

.study {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - var(--nav-h) - 40px);
  min-height: calc(100dvh - var(--nav-h) - 40px); /* 手机地址栏收纳后不跳动 */
}
.study-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 10px; }
.study-title { font-size: 15px; color: var(--muted); }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 19px;
  color: var(--muted);
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.bar { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin-bottom: 16px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand)); transition: width .25s ease; }

.card {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 300px;
  padding: 34px 22px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  user-select: none;
}
.card-word {
  font-size: clamp(2.4rem, 9vw, 4rem);
  font-weight: 700;
  letter-spacing: -.02em;
  text-align: center;
  word-break: break-word;
}
.speak-btn {
  position: absolute;
  top: 14px; right: 14px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--card-2);
  font-size: 20px;
}
.card-answer {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .18s ease, transform .18s ease;
  text-align: center;
  min-height: 74px;
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.card.revealed .card-answer { opacity: 1; transform: none; }
.card-ipa { color: var(--muted); font-size: clamp(1.05rem, 4.2vw, 1.45rem); font-weight: 500; letter-spacing: .02em; text-align: center; margin-top: 2px; }
.sf-ipa { color: var(--muted); font-size: 18px; }
.flash-ipa { color: #7f8fb5; font-size: clamp(1.1rem, 4.5vw, 1.6rem); }
.card-cn { font-size: 26px; font-weight: 600; }
.card-src { color: var(--muted); font-size: 13px; margin-top: 4px; }
.card-hint { position: absolute; bottom: 16px; color: var(--muted); font-size: 13px; }

.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }.tier {
  height: 76px;
  border-radius: 18px;
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow: var(--shadow-sm);
  transition: transform .1s ease;
}
.tier:active { transform: scale(.96); }
.tier small { font-size: 11px; opacity: .7; font-weight: 400; }
.tier-no { background: linear-gradient(180deg, #ff6b6b, var(--red)); }
.tier-mid { background: linear-gradient(180deg, #ffbf6b, var(--amber)); }
.tier-yes { background: linear-gradient(180deg, #4fd39c, var(--green)); }
/* ---------- 拼写卡（中文→英文） ---------- */

.spell-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
  padding: 26px 20px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--shadow);
  min-height: 300px;
}
.spell-tag { text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .08em; }
.spell-cn { text-align: center; font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; line-height: 1.3; word-break: break-word; }
.spell-unit { text-align: center; color: var(--muted); font-size: 13px; }
.spell-row { display: flex; gap: 10px; align-items: center; }
.spell-input {
  flex: 1;
  min-width: 0;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  font-size: 22px;
  letter-spacing: .01em;
}
.spell-input:focus { outline: none; border-color: var(--brand); background: var(--card); }
.spell-feedback {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 26px 20px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--shadow);
  min-height: 300px;
}
.spell-feedback.ok { border-top: 6px solid var(--green); }
.spell-feedback.mid { border-top: 6px solid var(--amber); }
.spell-feedback.bad { border-top: 6px solid var(--red); }
.sf-mark { font-size: 46px; font-weight: 800; line-height: 1; }
.ok .sf-mark { color: var(--green); }
.mid .sf-mark { color: var(--amber); }
.bad .sf-mark { color: var(--red); }
.sf-title { font-size: 20px; font-weight: 600; }
.sf-answer {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(2rem, 8vw, 3rem);
  font-weight: 800;
  letter-spacing: -.01em;
  text-align: center;
  word-break: break-word;
}
.sf-yours { color: var(--muted); font-size: 15px; }
.sf-yours b { color: var(--ink); }
.sf-note { color: var(--muted); font-size: 14px; text-align: center; }
.speak-btn.inline { position: static; width: 38px; height: 38px; flex: 0 0 auto; }
.practice { width: 100%; background: var(--card-2); border-radius: 16px; padding: 14px; }
.practice-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.practice-row { display: flex; gap: 8px; }
.practice-ok { color: var(--green); font-weight: 600; font-size: 16px; }

.badge.dir { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
.badge.dir.recog { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }

.form-row select {
  max-width: 215px;
  padding: 9px 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
}

@media (max-width: 460px) {
  .spell-row { flex-direction: column; align-items: stretch; }
  .spell-row .btn { width: 100%; }
}

button:focus-visible,
.btn:focus-visible,
.icon-btn:focus-visible,
.tier:focus-visible,
.mini:focus-visible,
.nav-btn:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent);
  outline-offset: 2px;
}

.key-hint { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0 2px; }

/* ---------- 完成页 ---------- */

.done-screen { text-align: center; padding: 26px 8px; }
.done-emoji { font-size: 54px; }
.done-screen h1 { margin: 8px 0 18px; font-size: 26px; }
.done-stats { display: flex; justify-content: center; gap: 12px; }
.ds {
  flex: 1;
  padding: 14px 6px;
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.ds b { display: block; font-size: 26px; }
.ds span { font-size: 13px; color: var(--muted); }
.ds-no b { color: var(--red); }
.ds-mid b { color: var(--amber); }
.ds-yes b { color: var(--green); }
.done-sub { color: var(--muted); margin-top: 14px; }
.done-progress { margin-top: 16px; font-size: 15px; }
.done-progress b { font-size: 20px; }
.done-hint { color: var(--muted); font-size: 14px; margin: 8px 0 14px; }
.done-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* ---------- 按钮 ---------- */

.btn {
  padding: 12px 18px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}
.btn:active { transform: scale(.98); }
.btn.primary { background: linear-gradient(180deg, var(--brand-2), var(--brand)); color: #fff; }
.btn.danger { background: color-mix(in srgb, var(--red) 14%, var(--card)); color: var(--red); }
.btn.ghost { background: var(--card-2); box-shadow: none; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.btn.wide { display: block; width: 100%; margin-top: 6px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

/* ---------- 红词本 ---------- */

.filter-row { margin: 4px 0 12px; }
.filter-row select, .search, .form-row input[type=number] {
  width: 100%;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
}
.red-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.red-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 16px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--red);
}
.red-en { font-size: 19px; font-weight: 600; }
.red-cn { font-size: 14px; color: var(--muted); }
.red-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; }
.badge.red { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.red-next { font-size: 12px; color: var(--muted); }

.empty-card {
  text-align: center;
  padding: 40px 20px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.empty-card.small { padding: 28px 20px; }
.empty-card h2 { margin: 8px 0 4px; font-size: 20px; }
.empty-card p { margin: 0; color: var(--muted); font-size: 14px; }
.empty-emoji { font-size: 44px; }

/* ---------- 快闪 ---------- */

.flash {
  position: fixed;
  inset: 0;
  margin: 0 auto;
  max-width: 760px;
  background: #0b0f1a;
  color: #f4f7ff;
  display: flex;
  flex-direction: column;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
}
.flash-head { display: flex; align-items: center; justify-content: space-between; }
.flash-title { color: #8d9ab5; font-size: 14px; letter-spacing: .1em; }
.flash .icon-btn { background: #1b2337; color: #cbd5f5; box-shadow: none; }
.flash-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  cursor: pointer;
}
.flash-word { font-size: clamp(3rem, 13vw, 5.6rem); font-weight: 800; letter-spacing: -.02em; }
.flash-cn { font-size: clamp(1.3rem, 5vw, 2rem); color: #9fb0d8; }
.flash-unit { font-size: 13px; color: #5c6b8f; margin-top: 8px; }
.flash-foot { display: flex; align-items: center; justify-content: center; gap: 22px; color: #8d9ab5; font-size: 14px; }

/* ---------- 家长页 ---------- */

.panel {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 14px;
}
.panel h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: baseline; justify-content: space-between; }
.h2-sub { font-size: 13px; color: var(--muted); font-weight: 400; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-box {
  background: var(--card);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  padding: 14px 10px;
  text-align: center;
}
.stat-box b { display: block; font-size: 24px; letter-spacing: -.02em; }
.stat-box b small { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat-box span { font-size: 12px; color: var(--muted); }

.form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
.form-row label { font-size: 15px; }
.form-row input[type=number] { width: 96px; text-align: center; }
.form-row.switch input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); }
.ro-line { color: var(--muted); font-size: 13px; margin-top: 10px; }
.ro-line.tiny { font-size: 12px; }

.unit-list { max-height: 330px; overflow-y: auto; margin-top: 10px; padding-right: 4px; }
.unit-row { padding: 12px 14px; border-radius: 14px; background: var(--card-2); margin-bottom: 8px; }
.unit-head { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
.unit-title { flex: 1; color: var(--ink); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-state { font-size: 12px; color: var(--muted); }
.unit-state.done { color: var(--green); }
.unit-state.learning { color: var(--brand); }
.unit-bar { height: 6px; border-radius: 99px; background: var(--line); margin: 8px 0 4px; overflow: hidden; }
.unit-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand)); }
.unit-meta { font-size: 12px; color: var(--muted); }
.unit-acts { display: flex; gap: 8px; margin-top: 8px; }
.mini {
  padding: 5px 10px;
  border-radius: 9px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
  font-size: 12px;
  color: var(--ink);
}
.mini.danger { color: var(--red); }

.test-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.test-row:last-child { border-bottom: 0; }
.test-mark { font-weight: 700; }
.test-row.ok .test-mark { color: var(--green); }
.test-row.bad .test-mark { color: var(--red); }
.test-name { font-size: 14px; }
.test-detail { font-size: 12px; color: var(--muted); }

.backup-list { max-height: 300px; overflow-y: auto; margin-top: 10px; }
.backup-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px;
}
.muted { color: var(--muted); font-size: 12px; }

/* ---------- 本地备份 ---------- */

.backup-box {
  background: var(--card-2);
  border-radius: 14px;
  padding: 12px 14px;
  margin-top: 10px;
}
.backup-box .btn { margin-top: 8px; }
.backup-box .btn-row { margin-top: 8px; }
.link-inline {
  color: var(--brand);
  font-weight: 600;
  text-decoration: underline;
  padding: 0 2px;
  background: none;
}
code {
  background: var(--card-2);
  padding: 1px 5px;
  border-radius: 6px;
  font-size: 13px;
}

/* ---------- 弹窗 ---------- */

.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10, 16, 32, .5);
  z-index: 60;
  backdrop-filter: blur(2px);
}
.modal.open { display: flex; }
.modal-card {
  width: 100%;
  max-width: 480px;
  max-height: 84vh;
  overflow-y: auto;
  padding: 22px;
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
}
.modal-card.wide { max-width: 560px; }
.modal-card h3 { margin: 0 0 10px; font-size: 19px; }
.modal-text { color: var(--muted); font-size: 14px; }
.modal-text.tiny { font-size: 12px; }
.preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.pv { background: var(--card-2); border-radius: 12px; padding: 10px; text-align: center; }
.pv b { display: block; font-size: 20px; }
.pv span { font-size: 11px; color: var(--muted); }
.warn-list { margin: 10px 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.rules { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.75; color: var(--muted); }
.rules li { margin-bottom: 4px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 18px);
  transform: translate(-50%, 12px);
  max-width: 86vw;
  padding: 11px 18px;
  border-radius: 99px;
  background: rgba(20, 28, 46, .92);
  color: #fff;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 80;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 底部导航 ---------- */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: 760px;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--line);
  z-index: 30;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 12px;
  color: var(--muted);
}
.nav-ico { font-size: 19px; line-height: 1; opacity: .5; }
.nav-btn.active { color: var(--brand); font-weight: 600; }
.nav-btn.active .nav-ico { opacity: 1; }

@media (max-width: 420px) {
  #view { padding: 16px 14px 8px; }
  .hero h1 { font-size: 26px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .study { min-height: calc(100vh - var(--nav-h) - 20px); }
  .study { min-height: calc(100dvh - var(--nav-h) - 20px); }
  .btn-grid { grid-template-columns: 1fr; }
}

/* ===== 手机 / 平板适配 ===== */

html { -webkit-text-size-adjust: 100%; }
body { overscroll-behavior-y: contain; touch-action: manipulation; }

/* 刘海屏 / 灵动岛：顶部留出安全区 */
#view { padding-top: max(20px, env(safe-area-inset-top, 0px)); }

/* iOS 长按卡片不要弹菜单、不要选中文字 */
.card, .spell-card, .spell-feedback, .task, .tier, .flash-body, .nav-btn, .link-btn, .mini {
  -webkit-touch-callout: none;
}
.card, .spell-card, .spell-feedback, .task, .tier { touch-action: manipulation; }

/* 提示条让开底部手势条 */
.toast { bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); }

/* 屏幕键盘弹出时收起底部导航，避免挡住拼写输入框 */
.kb-open .bottom-nav { display: none; }
.kb-open #app { padding-bottom: 12px; }

/* 触屏设备：按钮给足按下去的高度，键盘快捷键提示只对电脑有意义 */
@media (pointer: coarse) {
  .key-hint { display: none; }
  .nav-btn { min-height: 52px; }
  .link-btn, .mini { min-height: 40px; }
  .btn, .btn.small { min-height: 44px; }
  .tier { min-height: 72px; }
}

/* 小屏手机 */
@media (max-width: 380px) {
  .hero h1 { font-size: 24px; }
  .card { padding: 26px 16px; }
  .tier { height: 68px; font-size: 18px; }
  .spell-input { font-size: 20px; }
}

/* 横屏手机（矮屏）：卡片别被顶出屏幕 */
@media (max-height: 520px) {
  .study { min-height: 0; }
  .card, .spell-card, .spell-feedback { min-height: 190px; }
  .card-word { font-size: clamp(1.7rem, 7vw, 2.4rem); }
  .spell-cn { font-size: clamp(1.4rem, 5vw, 2rem); }
  .card-answer { min-height: 44px; }
  .tiers { margin-top: 8px; }
  .tier { min-height: 0; height: 56px; font-size: 17px; }
}

/* ---------- 使用说明（分享版底部页签） ---------- */

.guide-sec { padding: 16px 18px; }
.guide-sec h2 { margin-bottom: 10px; }
.guide-list {
  margin: 0;
  padding-left: 18px;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.7;
}
.guide-list li { margin-bottom: 7px; }
.guide-list li::marker { color: var(--brand); }
.guide-foot {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 4px 10px 20px;
}

/* ---------- 登录 / 注册 ---------- */

body.gated { overflow: hidden; }
body.gated #app, body.gated #modal { display: none; }

.gate {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(122, 141, 255, .22), transparent 60%),
    var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.gate[hidden] { display: none; }

.gate-box {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--shadow);
  padding: 28px 22px 22px;
}

.gate-logo { font-size: 34px; line-height: 1; text-align: center; }
.gate-title {
  margin: 10px 0 6px;
  font-size: 24px;
  text-align: center;
  letter-spacing: -.01em;
}
.gate-sub {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
}

.gate-tabs {
  display: flex;
  gap: 6px;
  padding: 5px;
  margin-bottom: 18px;
  border-radius: 14px;
  background: var(--card-2);
}
.gate-tab {
  flex: 1;
  padding: 10px 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
}
.gate-tab.on {
  background: var(--card);
  color: var(--brand);
  box-shadow: var(--shadow-sm);
}

.gate-field { display: block; margin-bottom: 14px; }
.gate-field > span {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: .02em;
}
.gate-field input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  outline: none;
  transition: border-color .15s ease, background .15s ease;
}
.gate-field input:focus {
  border-color: var(--brand);
  background: var(--card);
}

.gate-submit {
  width: 100%;
  height: 50px;
  margin-top: 4px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(180deg, var(--brand-2), var(--brand));
  box-shadow: 0 8px 20px rgba(75, 99, 240, .28);
}
.gate-submit:active { transform: scale(.99); }
.gate-submit[disabled] { opacity: .65; box-shadow: none; }

.gate-msg {
  display: none;
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  background: var(--card-2);
}
.gate-msg.show { display: block; }
.gate-msg.err {
  color: var(--red);
  background: color-mix(in srgb, var(--red) 10%, var(--card));
}
.gate-msg.ok {
  color: var(--green);
  background: color-mix(in srgb, var(--green) 10%, var(--card));
}

.gate-foot {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

.gate-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 0 6px;
}
.spin {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 3px solid var(--line);
  border-top-color: var(--brand);
  animation: gatespin .8s linear infinite;
}
@keyframes gatespin { to { transform: rotate(360deg); } }

.sync-banner {
  margin: 0 2px 12px;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  background: var(--card-2);
}
.sync-banner.err {
  color: var(--red);
  background: color-mix(in srgb, var(--red) 10%, var(--card));
}
.sync-banner b { color: inherit; }

</style>

<script>/*

  'use strict';

  function rfc4180(text) {

    unit_title: ['unittitle', 'unitname', 'title', 'name', '单元名', '单元标题'],
    page: ['page', '页码'],
    order: ['order', 'seq', '序号', '顺序'],
    en: ['en', 'word', 'english', 'worden', '单词', '英文'],
    pos: ['pos', '词性'],
    cn: ['cn', 'meaning', 'chinese', 'zh', '中文', '释义', '词义'],

  function fullToHalf(s) {

  /** 中文释义的键：去掉词性前缀与空格。 */

      .replace(/^[A-Za-z][A-Za-z./]*\.\s*/, '')

  function levenshtein(a, b) {
    if (a === b) return 0;
    var la = a.length, lb = b.length;
    if (!la) return lb;
    if (!lb) return la;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= lb; j++) prev[j] = j;

  }

  /** 同一个中文释义下的所有英文写法（电话 → phone / telephone）。 */
  function synonymGroup(word, units) {
    var out = [], seen = {};
    if (!word) return out;
    seen[answerKey(word.en)] = 1;
    out.push(word.en);
    if (!units || !units.length) return out;
    var key = cnKey(word.cn);

      var k = answerKey(item.word.en);
      if (seen[k]) return;

      out.push(item.word.en);
    });
    return out;
  }

  /**

  function checkSpelling(input, word, units, tolerance) {

    if (!key) return { result: null, distance: 0, matched: null, expected: expected, exact: false };

    var best = { distance: Infinity, en: expected };
    var exact = null;
    for (var i = 0; i < group.length; i++) {
      var gk = answerKey(group[i]);
      if (!gk) continue;
      if (gk === key) { exact = group[i]; break; }
      var d = levenshtein(key, gk);
      if (d < best.distance) best = { distance: d, en: group[i] };

          title: cell(row, col.unit_title) || uid,
          page: Number(cell(row, col.page)) || 0,

      var cn = cell(row, col.cn);

        phonetic: phonetic,
        cn: cn,

          en: w.en,
          phonetic: w.phonetic,
          cn: w.cn,
          pos: w.pos,
          tags: w.tags

      });

    });

  /* ---------------- 词状态 / 复习算法 ---------------- */

  function newWordState(today) {
    return {
      stage: 0,
      next_review: addDays(today, INTERVALS_DEFAULT[0]),
      status: 'new',
      last_result: null,
      wrong_count: 0,
      correct_streak: 0,
      last_review: null,
      first_learned: today,
      mastered: false
    };
  }

  function cloneState(s) {
    return {
      stage: s.stage || 0,
      next_review: s.next_review || null,
      status: s.status || 'new',
      last_result: s.last_result == null ? null : s.last_result,
      wrong_count: s.wrong_count || 0,
      correct_streak: s.correct_streak || 0,
      last_review: s.last_review || null,
      first_learned: s.first_learned || null,
      mastered: !!s.mastered

  /**

  function applyResult(prev, result, today, intervals) {
    var iv = (intervals && intervals.length ? intervals : INTERVALS_DEFAULT).slice();
    var s = cloneState(prev || newWordState(today));
    var before = s.stage;
    s.last_result = result;
    s.last_review = today;
    if (!s.first_learned) s.first_learned = today;

    if (result === 2) {
      s.correct_streak = (s.correct_streak || 0) + 1;
      if (s.correct_streak >= 2) s.stage = Math.min(s.stage + 1, iv.length - 1);
      s.next_review = addDays(today, iv[s.stage]);
      s.status = 'green';
    } else if (result === 1) {
      s.correct_streak = 0;
      s.next_review = addDays(today, 1);
      s.status = 'yellow';
    } else {
      s.stage = Math.max(0, s.stage - 1);
      s.correct_streak = 0;
      s.wrong_count = (s.wrong_count || 0) + 1;
      s.next_review = addDays(today, 1);
      s.status = 'red';
    }
    s.mastered = (s.stage >= iv.length - 1 && s.correct_streak >= 2);
    if (s.mastered) s.status = 'mastered';

  }

    if (settings && settings.spell_enabled === false) return true;

    if (mode === 'new') return true;
    if (mode === 'correct2') return (recogState.correct_streak || 0) >= 2 || !!recogState.mastered;
    return (recogState.correct_streak || 0) >= 1 || !!recogState.mastered;
  }

  function newTrackState(today) {
    return {
      stage: 0,
      next_review: addDays(today, INTERVALS_DEFAULT[0]),
      status: 'new',
      last_result: null,
      wrong_count: 0,
      correct_streak: 0,
      last_review: null,
      first_learned: today,
      mastered: false

  }

  function allWords(units) {
    var list = [];
    sortUnits(units).forEach(function (u) {
      u.words.forEach(function (w) { list.push({ word: w, unit: u }); });
    });
    return list;
  }

  /** 认词轨道的到期词（旧接口，供兼容与测试使用）。 */
  function getDueWords(units, states, today) {
    var due = [];
    allWords(units).forEach(function (item) {
      var st = states[item.word.id];
      if (!st || st.mastered) return;
      if (!isDateStr(st.next_review)) return;
      if (st.next_review > today) return;
      due.push({
        word: item.word,
        unit: item.unit,
        state: st,
        overdueDays: Math.max(0, daysBetween(st.next_review, today))
      });
    });
    due.sort(function (a, b) {
      if (a.overdueDays !== b.overdueDays) return b.overdueDays - a.overdueDays;
      var ra = statusRank(a.state.status), rb = statusRank(b.state.status);
      if (ra !== rb) return ra - rb;
      var wa = a.state.wrong_count || 0, wb = b.state.wrong_count || 0;
      if (wa !== wb) return wb - wa;
      if (a.state.next_review !== b.state.next_review) return a.state.next_review < b.state.next_review ? -1 : 1;
      return a.word.id < b.word.id ? -1 : (a.word.id > b.word.id ? 1 : 0);
    });
    return due;
  }

  /**
   * 每个词当天最多出一张卡：两条轨道都到期时只选一边（另一边保持到期，明天更优先）。
   */
  function getDueCandidates(units, states, settings, today) {
    var list = [];
    var spellOn = !(settings && settings.spell_enabled === false);
    allWords(units).forEach(function (item) {
      var st = states[item.word.id];
      if (!st) return;
      var recogDue = !st.mastered && isDateStr(st.next_review) && st.next_review <= today;
      var sp = st.spell || null;
      var spellDue = spellOn && !!(sp && !sp.mastered && isDateStr(sp.next_review) && sp.next_review <= today);
      var spellStart = spellOn && !sp && spellStartReady(st, settings);
      if (!recogDue && !spellDue && !spellStart) return;

      var recogOver = recogDue ? Math.max(0, daysBetween(st.next_review, today)) : -1;
      var spellOver = spellDue ? Math.max(0, daysBetween(sp.next_review, today)) : (spellStart ? 0 : -1);
      var dir = TRACK_RECOG;
      if (!recogDue) dir = TRACK_SPELL;
      else if (spellDue || spellStart) {
        if (spellOver > recogOver) dir = TRACK_SPELL;
        else if (recogOver > spellOver) dir = TRACK_RECOG;
        else dir = spellStart ? TRACK_SPELL : TRACK_RECOG;   // 同一天到期：新开始的拼写优先，让“写”及时登场
      }

      var chosen = dir === TRACK_SPELL ? (sp || null) : st;
      list.push({
        word: item.word,
        unit: item.unit,
        state: st,
        dir: dir,
        trackState: chosen,
        recogDue: recogDue,
        spellDue: spellDue,
        spellStart: spellStart,
        overdueDays: Math.max(0, recogOver, spellOver),
        rankStatus: chosen && chosen.status ? chosen.status : 'new',

        nextReview: chosen && chosen.next_review ? chosen.next_review : today

    });
    list.sort(function (a, b) {
      if (a.overdueDays !== b.overdueDays) return b.overdueDays - a.overdueDays;
      var ra = statusRank(a.rankStatus), rb = statusRank(b.rankStatus);
      if (ra !== rb) return ra - rb;
      if (a.wrongCount !== b.wrongCount) return b.wrongCount - a.wrongCount;
      if (a.nextReview !== b.nextReview) return a.nextReview < b.nextReview ? -1 : 1;
      return a.word.id < b.word.id ? -1 : (a.word.id > b.word.id ? 1 : 0);
    });
    return list;
  }

  function unitStatus(unit, states) {
    var learned = 0;
    unit.words.forEach(function (w) { if (states[w.id]) learned++; });
    if (learned === 0) return 'not_started';
    if (learned >= unit.words.length) return 'done';
    return 'learning';
  }

  function unitProgress(unit, states) {
    var learned = 0, mastered = 0, red = 0, yellow = 0, green = 0;
    unit.words.forEach(function (w) {
      var st = states[w.id];
      if (!st) return;
      learned++;
      if (st.mastered) mastered++;
      if (st.status === 'red') red++;
      else if (st.status === 'yellow') yellow++;
      else if (st.status === 'green') green++;
    });
    var total = unit.words.length;
    return {
      total: total,
      learned: learned,
      mastered: mastered,
      red: red,
      yellow: yellow,
      green: green,
      pct: total ? Math.round(learned / total * 100) : 0
    };
  }

  /** 把某个单元整体标记为“已学过”（词状态 stage 0，明天开始复习）。 */
  function learnUnit(unit, states, today) {
    var next = {};
    var k;
    for (k in states) next[k] = states[k];
    var added = 0;
    unit.words.forEach(function (w) {
      if (next[w.id]) return;
      next[w.id] = {
        stage: 0,
        next_review: addDays(today, INTERVALS_DEFAULT[0]),
        status: 'new',
        last_result: null,
        wrong_count: 0,
        correct_streak: 0,
        last_review: null,
        first_learned: today,
        mastered: false
      };
      added++;
    });
    return { states: next, added: added };
  }

  /**
   * 换词表时尽量保住学习进度：先按 id + 英文完全相同匹配，再按英文匹配。
   */
  function carryStates(oldUnits, oldStates, newUnits) {
    var oldById = {}, oldIdByEn = {};
    sortUnits(oldUnits || []).forEach(function (u) {
      u.words.forEach(function (w) {
        oldById[w.id] = w;
        var k = normalizeEn(w.en);
        if (!oldIdByEn[k]) oldIdByEn[k] = w.id;
      });
    });
    var next = {}, carried = 0;
    sortUnits(newUnits || []).forEach(function (u) {
      u.words.forEach(function (w) {
        var st = null;
        var ow = oldById[w.id];
        if (ow && normalizeEn(ow.en) === normalizeEn(w.en)) st = (oldStates || {})[w.id];
        if (!st) {
          var oid = oldIdByEn[normalizeEn(w.en)];
          if (oid) st = (oldStates || {})[oid];
        }
        if (st) { next[w.id] = st; carried++; }
      });
    });
    return { states: next, carried: carried };
  }

  /** 最近一次有记录的计划若没完成，就算漏卡：当天先只复习。空计划日不算漏卡。 */
  function isMissedPreviousDay(plans, today) {
    if (!plans) return false;
    for (var i = 1; i <= 3; i++) {
      var d = addDays(today, -i);
      var p = plans[d];
      if (!p) continue;
      var total = (p.new_words || []).length + (p.review_words || []).length;
      if (total === 0) continue;      // 那天本来就没任务，不应算漏卡
      return !p.completed;
    }
    return false;
  }

  function buildDailyPlan(units, states, settings, plans, today) {
    var s = settings || {};
    var reviewLimit = Math.max(0, Number(s.daily_review_limit));
    var newLimit = Math.max(0, Number(s.daily_new_limit));
    if (isNaN(reviewLimit)) reviewLimit = 25;
    if (isNaN(newLimit)) newLimit = 10;
    var spellOn = s.spell_enabled !== false;
    var spellCap = Math.max(0, Number(s.spell_daily_limit));
    if (isNaN(spellCap)) spellCap = 10;

    var due = getDueCandidates(units, states, s, today);

    /* 每天每个词只出一张卡；拼写卡再受单独上限约束 */
    var picked = [];
    var spellUsed = 0;
    due.forEach(function (c) {
      if (picked.length >= reviewLimit) return;
      var dir = c.dir;
      if (dir === TRACK_SPELL && spellUsed >= spellCap) {
        if (c.recogDue) dir = TRACK_RECOG;
        else return;
      }
      if (dir === TRACK_SPELL) spellUsed++;
      picked.push({
        word: c.word,
        unit: c.unit,
        dir: dir,
        state: dir === TRACK_SPELL ? (c.state.spell || null) : c.state,
        overdueDays: c.overdueDays
      });
    });

    var counts = { red: 0, yellow: 0, green: 0, new: 0 };
    var recogCount = 0, spellCount = 0;
    picked.forEach(function (d) {
      var st = d.state || {};
      counts[st.status] = (counts[st.status] || 0) + 1;
      if (d.dir === TRACK_SPELL) spellCount++; else recogCount++;
    });

    var openUnit = null;
    var sorted = sortUnits(units);
    for (var i = 0; i < sorted.length; i++) {
      if (unitStatus(sorted[i], states) !== 'done') { openUnit = sorted[i]; break; }
    }

    var newWords = [];
    if (openUnit && newLimit > 0) {
      openUnit.words.forEach(function (w) {
        if (newWords.length < newLimit && !states[w.id]) newWords.push({ word: w, unit: openUnit });
      });
    }

    var missed = isMissedPreviousDay(plans, today);
    var newPaused = false, newReduced = false;
    if (due.length > reviewLimit * 2) { newWords = []; newPaused = true; }
    else if (due.length > reviewLimit) {
      var half = Math.ceil(newLimit / 2);
      if (newWords.length > half) newWords = newWords.slice(0, half);
      if (half === 0) newPaused = true; else newReduced = true;
    }
    if (missed && newWords.length) { newWords = []; newPaused = true; }

    var total = newWords.length + picked.length;
    return {
      newWords: newWords,
      reviewWords: picked,
      meta: {
        today: today,
        dueTotal: due.length,
        reviewLimited: due.length > reviewLimit && picked.length === reviewLimit,
        counts: counts,
        recogCount: recogCount,
        spellCount: spellCount,
        spellCap: spellCap,
        spellEnabled: spellOn,
        newPaused: newPaused,
        newReduced: newReduced,
        missed: missed,
        openUnitId: openUnit ? openUnit.unit_id : null,
        openUnitTitle: openUnit ? openUnit.title : null,
        estimatedMinutes: total ? Math.max(1, Math.round(
          newWords.length * 1 + recogCount * 0.6 + spellCount * 1.1
        )) : 0
      }
    };
  }

  /* ---------------- 统计 ---------------- */

  function weekAccuracy(log, today, days, track) {
    var n = days || 7;
    var from = addDays(today, -(n - 1));
    var total = 0, score = 0, perfect = 0;
    (log || []).forEach(function (e) {
      if (!e || !isDateStr(e.date)) return;
      if (track && (e.track || TRACK_RECOG) !== track) return;
      if (e.date < from || e.date > today) return;
      total++;
      if (e.result === 2) { score += 1; perfect++; }
      else if (e.result === 1) score += 0.5;
    });
    return {
      total: total,
      perfect: perfect,
      accuracy: total ? Math.round(score / total * 100) : null
    };
  }

  function computeStreak(plans, today) {
    var d = today, streak = 0;
    var p0 = plans && plans[today];
    if (!(p0 && p0.completed)) d = addDays(today, -1);
    var guard = 0;
    while (guard++ < 4000) {
      var p = plans && plans[d];
      if (p && p.completed) { streak++; d = addDays(d, -1); } else break;
    }
    return streak;
  }

  function computeStats(units, states, plans, log, settings, today) {
    var learned = 0, mastered = 0, red = 0, yellow = 0, green = 0, fresh = 0;
    var recogMastered = 0, spellStarted = 0, spellMastered = 0, spellRed = 0;
    allWords(units).forEach(function (item) {
      var st = states[item.word.id];
      if (!st) return;
      learned++;
      if (wordMastered(st, settings)) mastered++;
      if (st.mastered) recogMastered++;
      if (st.spell) {
        spellStarted++;
        if (st.spell.mastered) spellMastered++;
        if (st.spell.status === 'red') spellRed++;
      }
      if (st.status === 'red') red++;
      else if (st.status === 'yellow') yellow++;
      else if (st.status === 'green') green++;
      else if (st.status === 'new') fresh++;
    });
    var due = getDueCandidates(units, states, settings, today);
    var dueSpell = 0;
    due.forEach(function (c) { if (c.dir === TRACK_SPELL) dueSpell++; });
    var doneUnits = 0, startedUnits = 0;
    sortUnits(units).forEach(function (u) {
      var s = unitStatus(u, states);
      if (s === 'done') doneUnits++;
      if (s !== 'not_started') startedUnits++;
    });
    var week = weekAccuracy(log, today, 7);
    var weekRecog = weekAccuracy(log, today, 7, TRACK_RECOG);
    var weekSpell = weekAccuracy(log, today, 7, TRACK_SPELL);
    return {
      totalUnits: units.length,
      doneUnits: doneUnits,
      startedUnits: startedUnits,
      totalWords: allWords(units).length,
      learnedWords: learned,
      masteredWords: mastered,
      recogMastered: recogMastered,
      spellStarted: spellStarted,
      spellMastered: spellMastered,
      spellRed: spellRed,
      red: red,
      redAll: red + spellRed,
      yellow: yellow,
      green: green,
      fresh: fresh,
      dueToday: due.length,
      dueSpell: dueSpell,
      weekTotal: week.total,
      weekPerfect: week.perfect,
      weekAccuracy: week.accuracy,
      weekRecogAccuracy: weekRecog.accuracy,
      weekSpellAccuracy: weekSpell.accuracy,
      streak: computeStreak(plans, today),
      todayPlan: (plans && plans[today]) || null
    };
  }

  function getRedWords(units, states) {
    var list = [];
    allWords(units).forEach(function (item) {
      var st = states[item.word.id];
      if (!st) return;
      if (st.status === 'red') list.push({ word: item.word, unit: item.unit, state: st, dir: TRACK_RECOG });
      if (st.spell && st.spell.status === 'red') {
        list.push({ word: item.word, unit: item.unit, state: st.spell, dir: TRACK_SPELL });
      }
    });
    list.sort(function (a, b) {
      var wa = a.state.wrong_count || 0, wb = b.state.wrong_count || 0;
      if (wa !== wb) return wb - wa;
      var na = a.state.next_review || '9999', nb = b.state.next_review || '9999';
      if (na !== nb) return na < nb ? -1 : 1;
      if (a.dir !== b.dir) return a.dir === TRACK_SPELL ? -1 : 1;
      return a.word.id < b.word.id ? -1 : (a.word.id > b.word.id ? 1 : 0);
    });
    return list;
  }

  /* ---------------- 导出 ---------------- */

  function csvEscape(v) {
    var s = String(v == null ? '' : v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportAnkiCSV(units, states) {
    var rows = ['word,meaning,phonetic,unit,status,wrong_count,spell_status,spell_wrong_count'];
    allWords(units).forEach(function (item) {
      var st = states[item.word.id] || {};
      var sp = st.spell || {};
      rows.push([
        csvEscape(String(item.word.en || '').trim().replace(/\s+/g, ' ')),
        csvEscape(String(item.word.cn || '').trim()),
        csvEscape(item.word.phonetic || ''),
        csvEscape(item.unit.unit_id + ' ' + item.unit.title),
        csvEscape(st.status || ''),
        csvEscape(st.wrong_count || 0),
        csvEscape(sp.status || ''),
        csvEscape(sp.wrong_count || 0)
      ].join(','));
    });
    return rows.join('\n') + '\n';
  }


  /* ---------------- 本地文件备份 ---------------- */

  /** 写进备份文件的内容（不含 backups，体积小、够恢复）。 */
  function backupPayload(data, now) {
    var d = data || {};
    var t = now || Date.now();
    return {
      app: 'ket-words',
      version: d.version || 1,
      saved_at: d.saved_at || t,
      exported_at: new Date(t).toISOString(),
      units: d.units || [],
      word_states: d.word_states || {},
      review_log: d.review_log || [],
      daily_plans: d.daily_plans || {},
      settings: d.settings || {},
      meta: d.meta || null
    };
  }

  /**
   * 启动时比较本机数据和备份，决定要不要恢复：
   *  restore  本机没有学习记录（典型：浏览器数据被清），直接用备份
   *  ask      备份比本机新，问一下
   *  keep     本机更新或备份无效，不动
   */
  function decideRestore(local, backup) {
    if (!backup || !Array.isArray(backup.units) || !backup.units.length) {
      return { action: 'keep', reason: '备份无效' };
    }
    var l = local || {};
    var localStates = Object.keys(l.word_states || {}).length;
    var localPlans = Object.keys(l.daily_plans || {}).length;
    var backupStates = Object.keys(backup.word_states || {}).length;
    var backupPlans = Object.keys(backup.daily_plans || {}).length;
    if (!localPlans && !localStates && (backupPlans || backupStates)) {
      return { action: 'restore', reason: '本机没有学习记录' };
    }
    if (!localPlans && backupPlans && (backup.saved_at || 0) > (l.saved_at || 0)) {
      return { action: 'restore', reason: '本机没有学习历史' };
    }
    if ((backup.saved_at || 0) > (l.saved_at || 0) + 3600 * 1000) {
      return { action: 'ask', reason: '备份比本机新' };
    }
    return { action: 'keep', reason: '本机更新' };
  }

  /* ---------------- 数据校验 / 修复 ---------------- */

  var STATUS_SET = { new: 1, red: 1, yellow: 1, green: 1, mastered: 1 };

  function toInt(v, def) {
    var n = parseInt(v, 10);
    return isNaN(n) ? def : n;
  }

  function clampInt(v, lo, hi, def) {
    var n = toInt(v, def);
    return Math.max(lo, Math.min(hi, n));
  }

  function dateOr(s, def) { return isDateStr(s) ? s : def; }

  /** 一条轨道的字段修复（认词与拼写共用）。 */
  function normalizeTrack(s, maxStage, today) {
    var stage = clampInt(s.stage, 0, maxStage, 0);
    var mastered = !!s.mastered;
    var status = String(s.status || '');
    if (!STATUS_SET[status]) {
      status = mastered ? 'mastered' : (stage >= maxStage ? 'green' : 'new');
    }
    if (mastered && status !== 'mastered') status = 'mastered';
    return Object.assign({}, s, {
      stage: stage,
      next_review: dateOr(s.next_review, today),
      status: status,
      last_result: (s.last_result === 0 || s.last_result === 1 || s.last_result === 2) ? s.last_result : null,
      wrong_count: Math.max(0, toInt(s.wrong_count, 0)),
      correct_streak: Math.max(0, toInt(s.correct_streak, 0)),
      last_review: dateOr(s.last_review, null),
      first_learned: dateOr(s.first_learned, null),
      mastered: mastered
    });
  }

  /**
   * 修复/规整数据：只补全和纠正，不删除任何学习状态、不改变词表内容。
   * 目的：旧版本数据、手改过的 JSON、导入的脏数据都能继续用。
   */
  function normalizeData(input, todayStr) {
    var d = input || {};
    var today = isDateStr(todayStr) ? todayStr : isoToday();
    var raw = d.settings || {};
    var intervals = (Array.isArray(raw.intervals) && raw.intervals.length)
      ? raw.intervals.map(function (n) { return Math.max(1, toInt(n, 1)); })
      : INTERVALS_DEFAULT.slice();
    var maxStage = intervals.length - 1;

    d.version = toInt(d.version, 1);

    /* 词表 */
    d.units = (Array.isArray(d.units) ? d.units : []).map(function (u, ui) {
      u = u || {};
      var unitId = String(u.unit_id == null ? 'U' + (ui + 1) : u.unit_id);
      var seenIds = {};
      var words = [];
      (Array.isArray(u.words) ? u.words : []).forEach(function (w, wi) {
        w = w || {};
        var en = String(w.en == null ? '' : w.en).trim();
        if (!en) return;
        var id = w.id == null ? '' : String(w.id).trim();
        if (!id) id = unitId + '-' + String(wi + 1).padStart(3, '0');
        if (seenIds[id]) {
          var k = 2;
          while (seenIds[id + '~' + k]) k++;
          id = id + '~' + k;
        }
        seenIds[id] = true;
        words.push(Object.assign({}, w, {
          id: id,
          en: en,
          phonetic: String(w.phonetic == null ? '' : w.phonetic),
          cn: String(w.cn == null ? '' : w.cn),
          pos: String(w.pos == null ? '' : w.pos),
          tags: Array.isArray(w.tags) ? w.tags.map(String) : []
        }));
      });
      return Object.assign({}, u, {
        unit_id: unitId,
        title: String(u.title == null ? unitId : u.title),
        page: toInt(u.page, 0),
        order: toInt(u.order, ui + 1),
        status: u.status === 'done' || u.status === 'learning' ? u.status : 'not_started',
        words: words
      });
    }).filter(function (u) { return u.words.length > 0; });

    /* 词状态：逐字段修复，绝不丢弃；spell 子状态同样修复 */
    var states = {};
    var rawStates = (d.word_states && typeof d.word_states === 'object') ? d.word_states : {};
    Object.keys(rawStates).forEach(function (id) {
      var s = rawStates[id] || {};
      var base = normalizeTrack(s, maxStage, today);
      if (s.spell && typeof s.spell === 'object') base.spell = normalizeTrack(s.spell, maxStage, today);
      else delete base.spell;
      states[id] = base;
    });
    d.word_states = states;

    /* 复习日志：只保留有效记录 */
    var log = [];
    (Array.isArray(d.review_log) ? d.review_log : []).forEach(function (e) {
      if (!e || !isDateStr(e.date) || !e.word_id) return;
      if (e.result !== 0 && e.result !== 1 && e.result !== 2) return;
      log.push({
        date: e.date,
        word_id: String(e.word_id),
        unit_id: e.unit_id ? String(e.unit_id) : '',
        result: e.result,
        track: e.track === TRACK_SPELL ? TRACK_SPELL : TRACK_RECOG,
        mode: e.mode ? String(e.mode) : 'review',
        stage_before: clampInt(e.stage_before, 0, maxStage, 0),
        stage_after: clampInt(e.stage_after, 0, maxStage, 0),
        next_review: dateOr(e.next_review, null)
      });
    });
    d.review_log = log.length > 6000 ? log.slice(-6000) : log;

    /* 每日计划：补上每个复习词的方向（旧计划默认认词） */
    var plans = {};
    Object.keys(d.daily_plans || {}).forEach(function (k) {
      if (!isDateStr(k)) return;
      var p = d.daily_plans[k] || {};
      var reviewIds = Array.isArray(p.review_words) ? p.review_words.map(String) : [];
      var dirs = {};
      var rawDirs = (p.dirs && typeof p.dirs === 'object') ? p.dirs : {};
      reviewIds.forEach(function (id) {
        dirs[id] = rawDirs[id] === TRACK_SPELL ? TRACK_SPELL : TRACK_RECOG;
      });
      plans[k] = Object.assign({}, p, {
        date: k,
        new_words: Array.isArray(p.new_words) ? p.new_words.map(String) : [],
        review_words: reviewIds,
        dirs: dirs,
        completed_words: Array.isArray(p.completed_words) ? p.completed_words.map(String) : [],
        completed: !!p.completed,
        meta: p.meta || null,
        created_at: p.created_at || null,
        finished_at: p.finished_at || null
      });
    });
    d.daily_plans = plans;

    /* 设置 */
    var spellStart = ['new', 'correct1', 'correct2'].indexOf(raw.spell_start) >= 0 ? raw.spell_start : 'correct1';
    var spellTol = ['strict', 'normal', 'loose'].indexOf(raw.spell_tolerance) >= 0 ? raw.spell_tolerance : 'normal';
    d.settings = Object.assign({}, raw, {
      daily_new_limit: clampInt(raw.daily_new_limit, 0, 40, 10),
      daily_review_limit: clampInt(raw.daily_review_limit, 1, 80, 25),
      intervals: intervals,
      start_date: dateOr(raw.start_date, today),
      backup_keep_days: clampInt(raw.backup_keep_days, 1, 30, 14),
      speech: raw.speech !== false,
      reveal_new: raw.reveal_new !== false,
      spell_enabled: raw.spell_enabled !== false,
      spell_daily_limit: clampInt(raw.spell_daily_limit, 0, 40, 10),
      spell_start: spellStart,
      spell_tolerance: spellTol
    });

    /* 备份：保留最近 14 天，只做结构规整 */
    var backups = {};
    Object.keys(d.backups || {}).sort().slice(-14).forEach(function (k) {
      if (!isDateStr(k)) return;
      var b = d.backups[k] || {};
      backups[k] = Object.assign({}, b, {
        ts: b.ts || null,
        word_states: b.word_states || {},
        daily_plans: b.daily_plans || {},
        settings: b.settings || {}
      });
    });
    d.backups = backups;

    return d;
  }

  /* ---------------- 自检（验收用例，PRD §10） ---------------- */

  function pad3(n) { return String(n).padStart(3, '0'); }

  function mkUnit(id, title, order, pairs) {
    return {
      unit_id: id, title: title, page: order, order: order, status: 'not_started',
      words: pairs.map(function (p, i) {
        return { id: id + '-' + pad3(i + 1), en: p[0], phonetic: p[2] || '', cn: p[1], pos: '', tags: [] };
      })
    };
  }

  function runSelfTests() {
    var tests = [];
    function t(name, fn) {
      try {
        var detail = fn();
        tests.push({ name: name, ok: true, detail: detail || '' });
      } catch (e) {
        tests.push({ name: name, ok: false, detail: e && e.message ? e.message : String(e) });
      }
    }
    function eq(actual, expected, label) {
      if (JSON.stringify(actual) !== JSON.stringify(expected)) {
        throw new Error((label || '') + ' 期望 ' + JSON.stringify(expected) + '，实际 ' + JSON.stringify(actual));
      }
    }
    function ok(cond, msg) { if (!cond) throw new Error(msg); }

    t('导入：按单元分组并合并重复词', function () {
      var csv = [
        'unit_id,unit_title,page,order,en,pos,cn,phonetic,tags',

  /* ---------------- 云账号与进度同步 ---------------- */

  var API_BASE = 'https://work-d1gs0jzrg2277d75e-1391683363.ap-shanghai.app.tcloudbase.com/ket-api';

      var ids = {};
      (p.new_words || []).concat(p.review_words || []).forEach(function (id) { ids[id] = 1; });

      if (!p.dirs) p.dirs = {};

    try { raw = window.localStorage.getItem(STORE_KEY); }
    catch (e) { storageOK = false; }

      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.units && parsed.units.length) { HAD_LOCAL = true; return normalize(parsed); }
        quarantine(raw);
      } catch (e) {
        quarantine(raw);
      }

  }

  /** 本地数据读不出来时，先把原始串留一份，别直接覆盖掉。 */
  function quarantine(raw) {
    try {
      window.localStorage.setItem(STORE_KEY + '_unreadable', raw);
      RECOVERY = true;
    } catch (e) { /* 空间不足就算了 */ }
  }

  function save() {

    try { json = JSON.stringify(DATA); } catch (e) { return; }
    try {
      window.localStorage.setItem(STORE_KEY, json);
      storageOK = true;
    } catch (e) {
      storageOK = false;
      var kept = false;
      var ladder = [7, 3];
      for (var i = 0; i < ladder.length && !kept; i++) {
        try {
          pruneBackups(ladder[i]);
          window.localStorage.setItem(STORE_KEY, json);
          storageOK = true;
          kept = true;
        } catch (e2) { /* 继续压缩 */ }
      }
      if (!kept) toast('浏览器本地存储写入失败，请到家长页导出备份', 4000);
    }

  }

  /** 当天第一次写操作前，先把当前状态备份下来（PRD §7）。 */
  function snapshot() {

    if (DATA.backups[d]) return;

      ts: Date.now(),
      word_states: clone(DATA.word_states),
      daily_plans: clone(DATA.daily_plans),
      settings: clone(DATA.settings)
    };
    pruneBackups(BACKUP_KEEP);
  }

  function pruneBackups(keep) {
    var keys = Object.keys(DATA.backups || {}).sort();
    while (keys.length > keep) {
      delete DATA.backups[keys.shift()];

  }


  /* ---------------- 账号：登录 / 注册 / 退出 ---------------- */

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (CLOUD.token) headers.Authorization = 'Bearer ' + CLOUD.token;
    return fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var err = new Error((data && data.message) || '请求失败（' + res.status + '）');
          err.status = res.status;
          err.code = data && data.error;
          throw err;
        }
        return data || {};
      });
    });
  }

  function saveToken(token, user) {

  function timeText(ts) {
    var d = new Date(Number(ts) || 0);
    if (!ts || isNaN(d.getTime())) return '—';
    var hh = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var t = today();
    var isToday = C.isoToday(d) === t;

  function cloudPayload() {

  function schedulePush() {
    if (!CLOUD.on || !CLOUD.token || !DATA) return;

  function pushNow() {
    if (!CLOUD.on || !CLOUD.token || !DATA) return Promise.resolve(false);
    if (CLOUD.pushing) { CLOUD.pushQueued = true; return Promise.resolve(false); }
    CLOUD.pushing = true;

    return api('/progress', { method: 'PUT', body: { payload: cloudPayload(), client_saved_at: savedAt } })
      .then(function () {

  function pullCloud() {

    var newEl = document.getElementById('pwd-new');

    if (!oldEl || !newEl || !new2El) return;
    var oldPwd = oldEl.value;
    var newPwd = newEl.value;

    if (!oldPwd) { pwdModalMsg('请先输入原密码'); return; }
    if (newPwd.length < 6 || newPwd.length > 64) { pwdModalMsg('新密码需要 6-64 位'); return; }
    if (newPwd !== new2El.value) { pwdModalMsg('两次输入的新密码不一致'); return; }
    if (newPwd === oldPwd) { pwdModalMsg('新密码不能和原密码一样'); return; }

    pwdModalMsg('');
    var btns = modalEl.querySelectorAll('.btn');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

    api('/change-password', { method: 'POST', body: { old_password: oldPwd, new_password: newPwd } })
      .then(function () {
        closeModal();
        toast('密码已修改，下次用新密码登录', 4000);
      })
      .catch(function (e) {
        for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
        pwdModalMsg((e && e.message) || '修改失败，请稍后重试');
      });
  }

  /* ---------------- 登录界面 ---------------- */

  function gateShell(inner) {
    return '<div class="gate-box">' + inner + '</div>';
  }

  function gateSetMsg(text, kind) {
    var el = document.getElementById('gate-msg');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'gate-msg' + (text ? ' show' : '') + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
  }

  function gateBusy(on, label) {
    GATE.busy = !!on;
    var btn = document.getElementById('gate-submit');
    if (!btn) return;
    btn.disabled = !!on;
    btn.textContent = on ? (label || '请稍候…') : (GATE.mode === 'reg' ? '注册并登录' : '登录');
  }

  function showGate(mode, msg) {
    if (!gateEl) return;
    document.body.classList.add('gated');
    gateEl.hidden = false;

    if (mode === 'loading') {
      gateEl.innerHTML = gateShell(
        '<div class="gate-logo">📖</div>' +
        '<h1 class="gate-title">KET 单词打卡</h1>' +
        '<p class="gate-sub">正在同步你的学习进度…</p>' +
        '<div class="gate-loading"><span class="spin"></span></div>'
      );
      return;
    }

    GATE.mode = mode === 'reg' ? 'reg' : 'login';
    GATE.busy = false;
    var isReg = GATE.mode === 'reg';
    gateEl.innerHTML = gateShell(
      '<div class="gate-logo">📖</div>' +
      '<h1 class="gate-title">KET 单词打卡</h1>' +
      '<p class="gate-sub">登录后进度跟账号走，换手机、换平板都能接着背</p>' +
      '<div class="gate-tabs">' +
        '<button type="button" class="gate-tab' + (isReg ? '' : ' on') + '" data-gate="login">登录</button>' +
        '<button type="button" class="gate-tab' + (isReg ? ' on' : '') + '" data-gate="reg">注册</button>' +
      '</div>' +
      '<form class="gate-form" id="gate-form" novalidate>' +
        (isReg
          ? '<label class="gate-field"><span>邀请码</span><input id="gate-invite" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="向发码的人索取"><\/label>'
          : '') +
        '<label class="gate-field"><span>用户名</span>' +
          '<input id="gate-user" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20" placeholder="3-20 位字母、数字或下划线">' +
        '</label>' +
        '<label class="gate-field"><span>密码</span>' +
          '<input id="gate-pass" type="password" autocomplete="' + (isReg ? 'new-password' : 'current-password') + '" maxlength="64" placeholder="至少 6 位">' +
        '</label>' +
        (isReg
          ? '<label class="gate-field"><span>昵称（可不填）</span><input id="gate-name" type="text" maxlength="24" placeholder="如：小明"></label>'
          : '') +
        '<button type="submit" class="gate-submit" id="gate-submit">' + (isReg ? '注册并登录' : '登录') + '</button>' +
      '</form>' +
      '<div class="gate-msg" id="gate-msg"></div>' +
      '<p class="gate-foot">' + (isReg
        ? '需要邀请码才能注册。用户名和密码都由你自己定，记牢即可。每个孩子一个账号，进度互不干扰。'
        : '忘记密码目前需要维护者在后台重置，建议把密码记在家长手机里。') + '</p>'
    );
    bindGate();
    gateSetMsg(msg || '', 'err');
  }

  function inviteFromUrl() {
    try {
      var m = /[?&]code=([^&#]*)/.exec(location.search || '');
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')).trim() : '';
    } catch (e) {
      return '';
    }
  }

  function bindGate() {
    var form = document.getElementById('gate-form');
    if (form) {
      form.addEventListener('submit', function (e) { e.preventDefault(); gateSubmit(); });
    }
    var tabs = gateEl.querySelectorAll('[data-gate]');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () {
        var m = this.getAttribute('data-gate');
        if (m === GATE.mode) return;
        showGate(m);
      });
    }
    var invInput = document.getElementById('gate-invite');
    var preInvite = inviteFromUrl();
    if (invInput && preInvite && !invInput.value) invInput.value = preInvite;
    var firstInput = invInput && !invInput.value ? invInput : document.getElementById('gate-user');
    if (firstInput) setTimeout(function () { try { firstInput.focus(); } catch (e) { /* 忽略 */ } }, 150);
  }

  function hideGate() {
    document.body.classList.remove('gated');
    if (gateEl) {
      gateEl.hidden = true;
      gateEl.innerHTML = '';
    }
  }

  function gateSubmit() {
    if (GATE.busy) return;
    var userEl = document.getElementById('gate-user');
    var passEl = document.getElementById('gate-pass');
    var nameEl = document.getElementById('gate-name');
    var invEl = document.getElementById('gate-invite');
    var username = ((userEl && userEl.value) || '').trim();
    var password = (passEl && passEl.value) || '';
    var invite = ((invEl && invEl.value) || '').trim();

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
      gateSetMsg('用户名需为 3-20 位字母、数字或下划线', 'err');
      return;
    }
    if (password.length < 6) {
      gateSetMsg('密码至少 6 位', 'err');
      return;
    }
    if (GATE.mode === 'reg' && !invite) {
      gateSetMsg('请填写邀请码，没有码就问发链接给你的人', 'err');
      return;
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      gateSetMsg('当前没有网络，登录后才能使用', 'err');
      return;
    }

    var isReg = GATE.mode === 'reg';
    gateBusy(true, isReg ? '注册中…' : '登录中…');
    var body = isReg
      ? { username: username, password: password, invite: invite, displayName: ((nameEl && nameEl.value) || '').trim() }
      : { username: username, password: password };

    api(isReg ? '/register' : '/login', { method: 'POST', body: body })
      .then(function (res) {
        saveToken(res.token, res.user);
        gateSetMsg('已登录，正在同步进度…', 'ok');
        return pullCloud().then(function () {
          hideGate();
          startApp();
        });
      })
      .catch(function (e) {
        gateBusy(false);
        var msg = (e && e.message) || '登录失败，请重试';
        if (e && e.code === 'username_taken') msg = '这个用户名已被注册，换一个或直接用密码登录';
        if (e && /^invite_/.test(e.code || '')) msg = (e && e.message) || '邀请码不对，请确认后再试';
        if (e && e.status === 429) msg = '尝试次数过多，请 10 分钟后再试';
        gateSetMsg(msg, 'err');
      });
  }

  /* 用云端进度覆盖本机（家长页手动操作） */

  function cloudLogout() {
    clearToken();
    closeModal();
