  /* ---------------- 本地文件夹备份（File System Access） ---------------- */


  /** 仅测试用：在内存里模拟一个备份文件夹句柄。 */
  function memoryBackupHandle() {
    var files = {};
    return {
      name: '内存备份',
      _files: files,
      queryPermission: function () { return Promise.resolve('granted'); },
      requestPermission: function () { return Promise.resolve('granted'); },
      getFileHandle: function (name) {
        return Promise.resolve({
          getFile: function () {
            if (!(name in files)) return Promise.reject(new Error('NotFound'));
            return Promise.resolve({ text: function () { return Promise.resolve(files[name]); } });
          },
          createWritable: function () {
            return Promise.resolve({
              write: function (t) { files[name] = String(t); return Promise.resolve(); },
              close: function () { return Promise.resolve(); }
            });
          }
        });
      }
    };
  }

  function backupSupported() {
    return typeof window.showDirectoryPicker === 'function' && !!window.indexedDB;
  }

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = window.indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbSet(key, val) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readonly');
        var req = tx.objectStore('kv').get(key);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function idbDel(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function ensurePermission(handle, request) {
    if (!handle || !handle.queryPermission) return Promise.resolve(false);
    return handle.queryPermission({ mode: 'readwrite' }).then(function (p) {
      if (p === 'granted') { BACKUP.permission = 'granted'; return true; }
      if (!request) { BACKUP.permission = p; return false; }
      return handle.requestPermission({ mode: 'readwrite' }).then(function (r) {
        BACKUP.permission = r;
        return r === 'granted';
      });
    }).catch(function () { return false; });
  }

  function writeBackupFile(handle, name, text) {
    return handle.getFileHandle(name, { create: true }).then(function (fh) {
      return fh.createWritable().then(function (w) {
        return w.write(text).then(function () { return w.close(); });
      });
    });
  }

  function readBackupFile(handle, name) {
    return handle.getFileHandle(name).then(function (fh) {
      return fh.getFile();
    }).then(function (f) {
      return f.text();
    });
  }

  function backupText() {
    return JSON.stringify(C.backupPayload(DATA), null, 1);
  }

  function performBackup() {
    if (!BACKUP.handle) return Promise.resolve(false);
    var text = backupText();
    var daily = 'ket-' + today() + '.json';
    BACKUP.lastError = '';
    return writeBackupFile(BACKUP.handle, BACKUP_FILE, text)
      .then(function () { return writeBackupFile(BACKUP.handle, daily, text); })
      .then(function () {
        BACKUP.lastAt = Date.now();
        BACKUP.lastWriteTs = BACKUP.lastAt;
        DATA.last_backup_at = BACKUP.lastAt;
        save();
        updateBackupUI();
        return true;
      })
      .catch(function (e) {
        BACKUP.lastError = (e && e.message) || '写入失败';
        updateBackupUI();
        return false;
      });
  }

  /** opts.request = 允许弹权限框（必须在点击里调用）；opts.force = 不受频率限制 */
  function autoBackup(opts) {
    opts = opts || {};
    if (!BACKUP.handle || BACKUP.busy) return Promise.resolve(false);
    if (!opts.force && BACKUP.lastWriteTs && Date.now() - BACKUP.lastWriteTs < 120000) {
      return Promise.resolve(false);
    }
    BACKUP.busy = true;
    return ensurePermission(BACKUP.handle, !!opts.request).then(function (ok) {
      if (!ok) { BACKUP.busy = false; updateBackupUI(); return false; }
      return performBackup().then(function (r) { BACKUP.busy = false; return r; });
    }).catch(function () {
      BACKUP.busy = false;
      return false;
    });
  }

  function connectBackupFolder() {
    if (!backupSupported()) {
      toast('这个浏览器不支持自动备份，可以继续用「导出 JSON 备份」', 4000);
      return;
    }
    Promise.resolve().then(function () {
      return window.showDirectoryPicker({ id: 'ket-words-backup', mode: 'readwrite' });
    }).then(function (handle) {
      BACKUP.handle = handle;
      BACKUP.permission = 'granted';
      return idbSet('handle', handle).then(function () { return autoBackup({ request: true, force: true }); });
    }).then(function (ok) {
      toast(ok ? '已连接备份文件夹，每天打卡后会自动备份' : '已连接，但写入失败，请检查文件夹权限', 4000);
      render();
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      toast('没有连接备份文件夹', 3000);
    });
  }

  function disconnectBackup() {
    BACKUP.handle = null;
    BACKUP.permission = 'unknown';
    idbDel('handle').then(function () { toast('已断开本地备份'); render(); }).catch(function () { render(); });
  }

  function backupAgeText(ts) {
    if (!ts) return '还没备份过';
    var d = C.isoToday(new Date(ts));
    var day = C.daysBetween(d, today());
    var hh = new Date(ts);
    var t = ('0' + hh.getHours()).slice(-2) + ':' + ('0' + hh.getMinutes()).slice(-2);
    return day === 0 ? '今天 ' + t : (day + ' 天前 ' + t);
  }

  function backupStatusHtml() {
    if (!backupSupported()) {
      return '<div class="ro-line">当前浏览器不支持自动写入文件夹，请继续用「导出 JSON 备份」。</div>';
    }
    if (!BACKUP.handle) {
      return '<div class="ro-line">还没有连接备份文件夹。选一个文件夹后，每天打卡会自动写入 <code>ket-latest.json</code> 和当天的备份文件；启动时自动读取比对。</div>' +
        '<button class="btn primary" data-act="connect-backup">选择备份文件夹</button>';
    }
    var name = BACKUP.handle.name || '已连接的文件夹';
    var perm = BACKUP.permission === 'granted' ? '可写' : (BACKUP.permission === 'denied' ? '权限被拒绝' : '需要点一下授权');
    var last = BACKUP.lastAt || DATA.last_backup_at;
    return '<div class="ro-line">已连接：<b>' + esc(name) + '</b>（' + esc(perm) + '）</div>' +
      '<div class="ro-line tiny">最近备份：' + esc(backupAgeText(last)) + ' · 文件 ket-latest.json + ket-' + today() + '.json' +
      (BACKUP.lastError ? ' · ⚠️ ' + esc(BACKUP.lastError) : '') + '</div>' +
      '<div class="btn-row">' +
      '<button class="btn primary" data-act="backup-now">立即备份</button>' +
      '<button class="btn" data-act="restore-backup-folder">从备份恢复</button>' +
      '<button class="btn ghost" data-act="disconnect-backup">断开</button>' +
      '</div>';
  }

  function updateBackupUI() {
    var el = document.getElementById('backup-status');
    if (el) el.innerHTML = backupStatusHtml();
  }

  function applyRestore(obj, why) {
    var next = normalize(obj);
    snapshot();
    next.backups = Object.assign({}, next.backups || {}, DATA.backups || {});
    DATA = next;
    HAD_LOCAL = true;
    C.applyPhonetics(DATA.units, PHON);
    buildIndex();
    save();
    MODE = { name: 'home' };
    render();
    toast('已从本地备份恢复' + (why ? '（' + why + '）' : '') + '：' + backupAgeText(obj && obj.saved_at), 4500);
  }

  function showRestorePrompt(obj, why) {
    var states = obj && obj.word_states ? Object.keys(obj.word_states).length : 0;
    openModal(
      '<h3>发现本地备份</h3>' +
      '<p class="modal-text">备份时间：' + esc(backupAgeText(obj && obj.saved_at)) + '，包含 ' + states + ' 条学习状态。<br>' +
      (why ? esc(why) + '。' : '') + '要用备份覆盖本机现在的数据吗？</p>' +
      '<div class="btn-row"><button class="btn ghost" data-act="close-modal">用本机的</button>' +
      '<button class="btn primary" data-act="confirm-restore-payload">恢复备份</button></div>'
    );
    PENDING.restore = obj;
  }

  function restoreFromFolder() {
    if (!BACKUP.handle) { toast('还没有连接备份文件夹'); return; }
    ensurePermission(BACKUP.handle, true).then(function (ok) {
      if (!ok) { toast('没有拿到文件夹权限'); return; }
      return readBackupFile(BACKUP.handle, BACKUP_FILE).then(function (text) {
        var obj = JSON.parse(text);
        PENDING.restore = obj;
        showRestorePrompt(obj, '手动恢复');
      });
    }).catch(function () {
      toast('没有找到备份文件（ket-latest.json）', 3500);
    });
  }

  function backupDecision(obj) {
    if (!HAD_LOCAL && (Object.keys(obj.word_states || {}).length || Object.keys(obj.daily_plans || {}).length)) {
      return { action: 'restore', reason: '本机数据被清空' };
    }
    return C.decideRestore(DATA, obj);
  }

  function initBackup() {
    if (!backupSupported()) { updateBackupUI(); return; }
    idbGet('handle').then(function (handle) {
      if (!handle) { updateBackupUI(); return; }
      BACKUP.handle = handle;
      return handle.queryPermission({ mode: 'readwrite' }).then(function (p) {
        BACKUP.permission = p;
        if (p !== 'granted') {
          updateBackupUI();
          if (!HAD_LOCAL) render();     // 本机没数据时首页给个恢复入口
          return;
        }
        return readBackupFile(handle, BACKUP_FILE).then(function (text) {
          var obj = JSON.parse(text);
          var decision = backupDecision(obj);
          if (decision.action === 'restore') applyRestore(obj, decision.reason);
          else if (decision.action === 'ask') showRestorePrompt(obj, decision.reason);
          else updateBackupUI();
        }).catch(function () { updateBackupUI(); });
      });
    }).catch(function () { updateBackupUI(); });
  }

  function mutate(fn) {
    snapshot();
    var out = fn();
    pruneLog();
    save();
    return out;
  }

  function pruneLog() {
    var from = C.addDays(today(), -(LOG_KEEP_DAYS - 1));
    DATA.review_log = DATA.review_log.filter(function (e) { return e && e.date && e.date >= from; });
    if (DATA.review_log.length > 6000) DATA.review_log = DATA.review_log.slice(-6000);
    var planKeys = Object.keys(DATA.daily_plans).sort();
    while (planKeys.length > 90) delete DATA.daily_plans[planKeys.shift()];
  }

  /* ---------------- 交互反馈 ---------------- */

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 2200);
  }

  function openModal(html, opts) {
    opts = opts || {};
    modalEl.innerHTML = '<div class="modal-card ' + (opts.wide ? 'wide' : '') + '">' + html + '</div>';
    modalEl.classList.add('open');
    modalEl._dismissible = opts.dismissible !== false;
  }

  function closeModal() {
    modalEl.classList.remove('open');
    modalEl.innerHTML = '';
  }

  function speak(text) {
    if (!DATA.settings.speech) return;
    if (!('speechSynthesis' in window)) { toast('这个浏览器不支持朗读'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB';
      u.rate = 0.85;
      var voices = window.speechSynthesis.getVoices() || [];
      if (voices.length) {
        var v = englishVoice(voices);
        if (v) u.voice = v;
        else if (!VOICE_HINTED) {
          VOICE_HINTED = true;
          toast('这台设备没有英文语音，可在系统设置里添加（不影响背词）', 4000);
        }
      }
      window.speechSynthesis.speak(u);
    } catch (e) { /* 忽略 */ }
  }

  /** 优先英式（音标是 RP），没有英式就退到任意英文语音。 */
  function englishVoice(voices) {
    var gb = null, us = null, any = null;
    for (var i = 0; i < voices.length; i++) {
      var lang = String(voices[i].lang || '');
      if (!/^en[-_]/i.test(lang)) continue;
      if (!gb && /^en[-_]GB/i.test(lang)) gb = voices[i];
      else if (!us && /^en[-_]US/i.test(lang)) us = voices[i];
      if (!any) any = voices[i];
    }
    return gb || us || any;
  }

  /* ---------------- 屏幕常亮（手机 / 平板） ---------------- */

  function wakeSupported() {
    return typeof navigator !== 'undefined' && !!navigator.wakeLock && typeof navigator.wakeLock.request === 'function';
  }

  function releaseWake() {
    if (!WAKE.sentinel) return;
    try { WAKE.sentinel.release(); } catch (e) { /* 忽略 */ }
    WAKE.sentinel = null;
  }

  /** 设置里开着常亮、页面可见、系统支持，才持有一把锁；其余情况释放。 */
  function applyWake() {
    var want = !!(DATA && DATA.settings && DATA.settings.keep_awake) && !document.hidden;
    if (!want || !wakeSupported()) { releaseWake(); return; }
    if (WAKE.sentinel) return;
    navigator.wakeLock.request('screen').then(function (s) {
      WAKE.sentinel = s;
      s.addEventListener('release', function () { if (WAKE.sentinel === s) WAKE.sentinel = null; });
    }).catch(function () { /* 用户/系统拒绝，静默 */ });
  }

  function toggleAwake() {
    if (!wakeSupported()) {
      toast('这个浏览器不支持屏幕常亮，可在系统设置里延长息屏时间', 3500);
      return;
    }
    mutate(function () { DATA.settings.keep_awake = !DATA.settings.keep_awake; });
    applyWake();
    toast(DATA.settings.keep_awake ? '已开启屏幕常亮' : '已关闭屏幕常亮');
    render();
  }

  function download(name, text, mime) {
    var blob = null;
    try { blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' }); } catch (e) { blob = null; }
    var url = blob ? URL.createObjectURL(blob) : ('data:' + (mime || 'text/plain') + ';charset=utf-8,' + encodeURIComponent(text));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (blob) URL.revokeObjectURL(url);
      a.remove();
    }, 1500);
  }

  function pickFile(accept, cb) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { cb(String(reader.result || ''), f.name); };
      reader.onerror = function () { toast('读取文件失败'); };
      reader.readAsText(f, 'utf-8');
    });
    inp.click();
  }

  /* ---------------- 单词操作（认词 / 拼写两条轨道） ---------------- */

  function currentCard() {
    if (MODE.name !== 'study') return null;
    return MODE.queue[MODE.i] || null;
  }

  function dayChanged() {
    if (app.dataset.date && app.dataset.date !== today()) {
      app.dataset.date = today();
      MODE = { name: 'home' };
      UNDO = [];
      render();
      return true;
    }
    return false;
  }

  /** 写一次打分到对应轨道；不负责翻页。 */
  function applyCardResult(card, result) {
    var d = today();
    var plan = currentPlan();
    var item = INDEX[card.id];
    var st = DATA.word_states[card.id] || null;
    var isSpell = card.dir === C.TRACK_SPELL;
    var trackPrev = isSpell
      ? ((st && st.spell) ? st.spell : C.newTrackState(d))
      : (st || C.newWordState(d));

    snapshot();
    UNDO.push({
      wordId: card.id,
      dir: card.dir,
      prevState: st ? clone(st) : null,
      completed: (plan.completed_words || []).slice(),
      planCompleted: !!plan.completed,
      logLen: DATA.review_log.length,
      i: MODE.i,
      stats: clone(MODE.stats)
    });
    if (UNDO.length > 20) UNDO.shift();

    var wasCompleted = !!plan.completed;
    var r = C.applyResult(trackPrev, result, d, DATA.settings.intervals);
    if (isSpell) {
      DATA.word_states[card.id] = Object.assign({}, st || C.newWordState(d), { spell: r.state });
    } else {
      DATA.word_states[card.id] = Object.assign({}, st || {}, r.state);
    }
    DATA.review_log.push({
      date: d,
      word_id: card.id,
      unit_id: item.unit.unit_id,
      result: result,
      track: card.dir,
      mode: MODE.mode,
      stage_before: r.stageBefore,
      stage_after: r.stageAfter,
      next_review: r.state.next_review
    });
    if ((plan.completed_words || []).indexOf(card.id) < 0) {
      plan.completed_words = (plan.completed_words || []).concat(card.id);
    }
    if (planDone(plan) >= planTotal(plan) && planTotal(plan) > 0) plan.completed = true;
    MODE.stats[result] = (MODE.stats[result] || 0) + 1;
    save();
    if (!wasCompleted && plan.completed) autoBackup({ request: true });
    return r;
  }

  function advanceCard() {
    MODE.i++;
    MODE.phase = 'input';
    MODE.spellCheck = null;
    MODE.spellInput = '';
    MODE.practiceOk = false;
    if (MODE.i >= MODE.queue.length) {
      MODE.name = 'complete';
    } else {
      var next = MODE.queue[MODE.i];
      MODE.revealed = next.dir !== C.TRACK_SPELL && MODE.mode === 'new' && DATA.settings.reveal_new !== false;
    }
    render();
  }

  function markWord(result) {
    var card = currentCard();
    if (!card || card.dir === C.TRACK_SPELL) return;
    if (result !== 0 && result !== 1 && result !== 2) return;
    if (dayChanged()) return;
    applyCardResult(card, result);
    advanceCard();
  }

  function submitSpelling(value) {
    var card = currentCard();
    if (!card || card.dir !== C.TRACK_SPELL || MODE.phase === 'feedback') return;
    var item = INDEX[card.id];
    var res = C.checkSpelling(value, item.word, DATA.units, DATA.settings.spell_tolerance);
    if (res.result === null) { toast('先写出英文再提交'); focusSpellInput(); return; }
    if (dayChanged()) return;
    MODE.spellCheck = res;
    MODE.spellInput = value;
    MODE.phase = 'feedback';
    applyCardResult(card, res.result);
    render();
  }

  function skipSpelling() {
    var card = currentCard();
    if (!card || card.dir !== C.TRACK_SPELL || MODE.phase === 'feedback') return;
    if (dayChanged()) return;
    MODE.spellCheck = { result: 0, distance: null, matched: null, expected: INDEX[card.id].word.en };
    MODE.spellInput = '';
    MODE.phase = 'feedback';
    applyCardResult(card, 0);
    render();
  }

  function practiceSpelling(value) {
    var card = currentCard();
    if (!card) return;
    var item = INDEX[card.id];
    var res = C.checkSpelling(value, item.word, DATA.units, 'normal');
    MODE.practiceOk = res.result === 2;
    if (MODE.practiceOk) {
      toast('拼对了 ✓');
    } else {
      toast('再看一眼，跟着拼一遍');
    }
    render();
  }

  function spellContinue() {
    if (MODE.name !== 'study' || MODE.phase !== 'feedback') return;
    advanceCard();
  }

  function undoLast() {
    if (!UNDO.length) { toast('没有可以撤销的操作'); return; }
    if (dayChanged()) return;
    var u = UNDO.pop();
    var plan = currentPlan();
    if (u.prevState) DATA.word_states[u.wordId] = u.prevState;
    else delete DATA.word_states[u.wordId];
    plan.completed_words = u.completed;
    plan.completed = u.planCompleted;
    DATA.review_log = DATA.review_log.slice(0, u.logLen);
    MODE = {
      name: 'study',
      mode: MODE.mode || 'review',
      queue: MODE.queue,
      i: u.i,
      revealed: false,
      phase: 'input',
      stats: u.stats || { 0: 0, 1: 0, 2: 0 }
    };
    save();
    render();
  }

  function sessionCards(mode) {
    var plan = currentPlan();
    var ids = (mode === 'new' ? plan.new_words : plan.review_words) || [];
    var doneIds = plan.completed_words || [];
    var dirs = plan.dirs || {};
    return ids.filter(function (id) {
      return doneIds.indexOf(id) < 0 && INDEX[id];
    }).map(function (id) {
      return { id: id, dir: mode === 'new' ? C.TRACK_RECOG : (dirs[id] || C.TRACK_RECOG) };
    });
  }

  function startSession(mode) {
    var queue = sessionCards(mode);
    UNDO = [];
    if (!queue.length) {
      toast(mode === 'new' ? '今天的新词已经学完了' : '今天的复习已经做完了');
      return;
    }
    MODE = {
      name: 'study',
      mode: mode,
      queue: queue,
      i: 0,
      phase: 'input',
      revealed: mode === 'new' && queue[0].dir !== C.TRACK_SPELL && DATA.settings.reveal_new !== false,
      stats: { 0: 0, 1: 0, 2: 0 },
      newMarked: 0
    };
    render();
  }

  function finishDay() {
    var plan = currentPlan();
    if (plan.completed) { toast('今天已经打卡啦'); return; }
    mutate(function () { plan.completed = true; plan.finished_at = Date.now(); });
    UNDO = [];
    autoBackup({ request: true, force: true });
    toast('今日打卡完成 ✓');
    MODE = { name: 'home' };
    render();
  }

  /* ---------------- 渲染：今日 ---------------- */

  function unitLabel(unit) {
    if (!unit) return '';
    return unit.unit_id + ' ' + unit.title;
  }

  function reviewDesc(counts) {
    var parts = [];
    if (counts.red) parts.push('红 ' + counts.red);
    if (counts.yellow) parts.push('黄 ' + counts.yellow);
    if (counts.green) parts.push('绿 ' + counts.green);
    if (counts.new) parts.push('未测 ' + counts.new);
    return parts.length ? parts.join(' · ') : '按顺序复习';
  }

  function dataHealth() {
    var ids = {}, words = 0;
    DATA.units.forEach(function (u) {
      u.words.forEach(function (w) { ids[w.id] = 1; words++; });
    });
    var stateIds = Object.keys(DATA.word_states || {});
    var orphans = 0;
    stateIds.forEach(function (id) { if (!ids[id]) orphans++; });
    return {
      words: words,
      states: stateIds.length,
      orphans: orphans,
      log: (DATA.review_log || []).length,
      backups: Object.keys(DATA.backups || {}).length
    };
  }

  function planDirCounts(plan) {
    var recog = 0, spell = 0;
    var dirs = plan.dirs || {};
    (plan.review_words || []).forEach(function (id) {
      if (dirs[id] === C.TRACK_SPELL) spell++; else recog++;
    });
    return { recog: recog, spell: spell };
  }

  function renderHome() {
    var d = today();
    var plan = currentPlan();
    var total = planTotal(plan);
    var done = planDone(plan);
    var stats = C.computeStats(DATA.units, DATA.word_states, DATA.daily_plans, DATA.review_log, DATA.settings, d);
    var reviewLeft = (plan.review_words || []).filter(function (id) { return (plan.completed_words || []).indexOf(id) < 0; }).length;
    var newLeft = (plan.new_words || []).filter(function (id) { return (plan.completed_words || []).indexOf(id) < 0; }).length;
    var counts = plan.meta && plan.meta.counts ? plan.meta.counts : { red: 0, yellow: 0, green: 0, new: 0 };
    var minutes = plan.meta ? plan.meta.estimatedMinutes : 0;
    var openUnit = plan.meta && plan.meta.openUnitId ? unitById(plan.meta.openUnitId) : null;
    var allDone = total > 0 && done >= total;
    var dirs = planDirCounts(plan);
    var dirText = dirs.spell
      ? '复习 ' + plan.review_words.length + '（认词 ' + dirs.recog + ' · 拼写 ' + dirs.spell + '）'
      : '复习 ' + (plan.review_words || []).length;

    var html = '';
    html += '<header class="hero">';
    html += '<div class="hero-date">' + esc(C.formatCN(d)) + '</div>';
    html += '<h1>' + (allDone ? '今天完成啦 🎉' : '今天要背的词') + '</h1>';
    if (allDone) {
      html += '<div class="hero-sub">共 ' + total + ' 张卡，全部完成 · 预计 ' + minutes + ' 分钟</div>';
    } else {
      html += '<div class="hero-sub">' + dirText + ' · 新学 ' + (plan.new_words || []).length +
        (minutes ? ' · 约 ' + minutes + ' 分钟' : '') + '</div>';
    }
    html += '</header>';

    if (total === 0) {
      html += '<div class="empty-card"><div class="empty-emoji">🌴</div><h2>今天没有任务</h2><p>' +
        (plan.meta && plan.meta.dueTotal === 0 && !openUnit ? '所有单元都学完了，也没有到期的复习词。' : '没有到期的复习词，也没有可以学的新词。') +
        '</p></div>';
    } else {
      html += '<div class="tasks">';

      if ((plan.review_words || []).length) {
        html += '<button class="task task-review" data-act="start-review"' + (reviewLeft ? '' : ' disabled') + '>';
        html += '<div class="task-line"><span class="task-tag">复习</span><span class="task-num">' + reviewLeft + '<small>/' + plan.review_words.length + '</small></span></div>';
        html += '<div class="task-desc">' + (reviewLeft ? (dirs.spell ? '认词 ' + dirs.recog + ' · 拼写 ' + dirs.spell : reviewDesc(counts)) : '已全部复习完成') + '</div>';
        html += '<div class="task-bottom"><div class="task-bar"><i style="width:' + (plan.review_words.length ? Math.round((plan.review_words.length - reviewLeft) / plan.review_words.length * 100) : 100) + '%"></i></div>';
        html += '<span class="task-go">' + (reviewLeft ? '开始 ›' : '已完成 ✓') + '</span></div>';
        html += '</button>';
      }

      if ((plan.new_words || []).length) {
        html += '<button class="task task-new" data-act="start-new"' + (newLeft ? '' : ' disabled') + '>';
        html += '<div class="task-line"><span class="task-tag">新学</span><span class="task-num">' + newLeft + '<small>/' + plan.new_words.length + '</small></span></div>';
        html += '<div class="task-desc">' + esc(openUnit ? unitLabel(openUnit) : '') + '</div>';
        html += '<div class="task-bottom"><div class="task-bar"><i style="width:' + (plan.new_words.length ? Math.round((plan.new_words.length - newLeft) / plan.new_words.length * 100) : 100) + '%"></i></div>';
        html += '<span class="task-go">' + (newLeft ? '开始 ›' : '已完成 ✓') + '</span></div>';
        html += '</button>';
      }

      if (plan.meta && plan.meta.missed) {
        html += '<div class="notice">昨天没有完成打卡，今天先只复习，新词暂停一天。</div>';
      } else if (plan.meta && plan.meta.newPaused && (plan.review_words || []).length) {
        html += '<div class="notice">到期的词比较多（' + plan.meta.dueTotal + ' 个），今天先只复习，新词暂停。</div>';
      } else if (plan.meta && plan.meta.newReduced && (plan.new_words || []).length) {
        html += '<div class="notice">到期的词有点多，今天新词减半。</div>';
      }

      html += '</div>';
    }

    if (total > 0) {
      html += '<div class="home-foot">';
      html += '<div class="foot-progress">今日完成 <b>' + done + '</b>/' + total + ' · 连续打卡 <b>' + stats.streak + '</b> 天</div>';
      if (!plan.completed && done > 0 && !allDone) {
        html += '<button class="btn ghost small" data-act="finish-day">提前打卡</button>';
      }
      if (plan.completed) {
        html += '<div class="done-badge">✓ 今天已打卡</div>';
      }
      html += '</div>';
    }

    if (!HAD_LOCAL) {
      if (DIST) {
        html += '<div class="notice">第一次使用：每天自动排好「新学 + 复习」，点上面的卡片开始就行。' +
          '进度保存在这台设备上，换设备请用家长页的 JSON 导入导出。</div>';
      } else {
        html += '<div class="notice">本机还没有学习记录。' +
          (BACKUP.handle ? '检测到之前连接过备份文件夹，可以' : '如果之前备份过，去家长页') +
          (BACKUP.handle
            ? '<button class="link-inline" data-act="restore-banner">从本地备份恢复</button>'
            : '<button class="link-inline" data-act="open-parent">连接备份文件夹</button>') +
          '。</div>';
      }
    }
    if (!storageOK) {
      html += '<div class="notice">⚠️ 这个浏览器不保存数据，进度会丢。请用系统浏览器打开' +
        '（安卓 Chrome / Edge，iPhone、iPad 的 Safari）；微信、QQ 内置浏览器和 iOS「文件」预览都不保存。' +
        '现在可以先到家长页「导出 JSON 备份」。</div>';
    }
    html += '<div class="home-links">';
    html += '<button class="link-btn" data-act="open-red">🔴 红词本 <span class="pill">' + stats.redAll + '</span></button>';
    html += '</div>';

    viewEl.innerHTML = html;
  }

  /* ---------------- 渲染：卡片 ---------------- */

  function renderStudy() {
    var card = MODE.queue[MODE.i];
    var item = card ? INDEX[card.id] : null;
    if (!item) { MODE.i++; render(); return; }
    var total = MODE.queue.length;
    var n = MODE.i + 1;
    var isSpell = card.dir === C.TRACK_SPELL;
    var isNew = MODE.mode === 'new';

    var html = '';
    html += '<div class="study">';
    html += '<div class="study-head">';
    html += '<button class="icon-btn" data-act="exit-study" title="退出">←</button>';
    html += '<div class="study-title">' + (isNew ? '新学' : (isSpell ? '拼写 · 中文→英文' : '复习 · 英文→中文')) + ' · ' + n + '/' + total + '</div>';
    html += '<button class="icon-btn" data-act="undo" title="撤销上一个">↶</button>';
    html += '</div>';
    html += '<div class="bar"><i style="width:' + Math.round(MODE.i / total * 100) + '%"></i></div>';
    html += isSpell ? renderSpellCard(card, item) : renderRecogCard(card, item, isNew);
    html += '</div>';

    viewEl.innerHTML = html;

    if (isSpell) {
      if (MODE.phase === 'feedback') {
        var cont = document.getElementById('spell-continue');
        if (cont) cont.focus();
      } else {
        focusSpellInput();
      }
    }
  }

  function renderRecogCard(card, item, isNew) {
    var word = item.word;
    var revealed = !!MODE.revealed;
    var html = '';
    html += '<div class="card' + (revealed ? ' revealed' : '') + '" data-act="card-reveal" data-word-id="' + esc(card.id) + '">';
    html += '<div class="card-word">' + esc(word.en) + '</div>';
    if (word.phonetic) html += '<div class="card-ipa">' + esc(word.phonetic) + '</div>';
    html += '<button class="speak-btn" data-act="speak" data-text="' + esc(word.en) + '" title="朗读">🔊</button>';
    html += '<div class="card-answer">';
    html += '<div class="card-cn">' + esc(word.cn) + '</div>';
    html += '<div class="card-src">' + esc(unitLabel(item.unit)) + '</div>';
    html += '</div>';
    html += '<div class="card-hint">' + (revealed ? '再点一下隐藏' : '想一想，点这里看答案') + '</div>';
    html += '</div>';
    html += '<div class="tiers">';
    html += '<button class="tier tier-no" data-act="mark" data-r="0">不会<small>1</small></button>';
    html += '<button class="tier tier-mid" data-act="mark" data-r="1">模糊<small>2</small></button>';
    html += '<button class="tier tier-yes" data-act="mark" data-r="2">会<small>3</small></button>';
    html += '</div>';
    html += '<div class="key-hint">键盘：空格看答案 · 1 / 2 / 3 打分 · ← 撤销</div>';
    return html;
  }

  function renderSpellCard(card, item) {
    var word = item.word;
    var chk = MODE.spellCheck;
    var html = '';

    if (MODE.phase === 'feedback' && chk) {
      var res = chk.result;
      var cls = res === 2 ? 'ok' : (res === 1 ? 'mid' : 'bad');
      html += '<div class="spell-feedback ' + cls + '" data-word-id="' + esc(card.id) + '">';
      html += '<div class="sf-mark">' + (res === 2 ? '✓' : (res === 1 ? '≈' : '✗')) + '</div>';
      html += '<div class="sf-title">' + (res === 2 ? '写对了' : (res === 1 ? '差一点' : '没写对')) + '</div>';
      html += '<div class="sf-answer">' + esc(word.en) + '<button class="speak-btn inline" data-act="speak" data-text="' + esc(word.en) + '" title="朗读">🔊</button></div>';
      if (word.phonetic) html += '<div class="sf-ipa">' + esc(word.phonetic) + '</div>';
      if (chk.matched && C.answerKey(chk.matched) !== C.answerKey(word.en)) {
        html += '<div class="sf-note">同义写法「' + esc(chk.matched) + '」也算对</div>';
      }
      if (MODE.spellInput) {
        html += '<div class="sf-yours">你写的是：<b>' + esc(MODE.spellInput) + '</b></div>';
      }
      if (res === 2) {
        html += '<div class="sf-note">记作「会」</div>';
      } else if (res === 1) {
        html += '<div class="sf-note">差 ' + chk.distance + ' 个字母，记作「模糊」，明天再来</div>';
      } else if (chk.distance != null && chk.distance < 4) {
        html += '<div class="sf-note">差 ' + chk.distance + ' 个字母，记作「不会」，明天再来</div>';
      } else {
        html += '<div class="sf-note">记作「不会」，明天再来</div>';
      }
      if (res !== 2) {
        html += '<div class="practice">';
        html += '<div class="practice-label">跟着拼一遍（不计分）</div>';
        if (MODE.practiceOk) {
          html += '<div class="practice-ok">✓ 拼对了</div>';
        } else {
          html += '<div class="practice-row">';
          html += '<input id="practice-input" class="spell-input" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="照着拼一遍">';
          html += '<button class="btn primary" data-act="practice-submit">检查</button>';
          html += '</div>';
        }
        html += '</div>';
      }
      html += '<button class="btn primary wide" id="spell-continue" data-act="spell-continue">继续</button>';
      html += '</div>';
      return html;
    }

    html += '<div class="spell-card">';
    html += '<div class="spell-tag">中文 → 英文</div>';
    html += '<div class="spell-cn">' + esc(word.cn) + '</div>';
    html += '<div class="spell-unit">' + esc(unitLabel(item.unit)) + '</div>';
    html += '<div class="spell-row">';
    html += '<input id="spell-input" class="spell-input" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="写出英文">';
    html += '<button class="btn primary" data-act="spell-submit">提交</button>';
    html += '</div>';
    html += '<button class="btn ghost wide" data-act="spell-skip">不会，看答案</button>';
    html += '<div class="card-hint">回车提交 · 拼错一点算「模糊」，明天再来</div>';
    html += '</div>';
    return html;
  }

  function focusSpellInput() {
    var inp = document.getElementById('spell-input');
    if (inp) {
      try { inp.focus(); } catch (e) { /* 忽略 */ }
    }
  }

  function bindSpellInputs() {

  function renderFlash() {
    var list = MODE.list || [];
    if (!list.length) { MODE = { name: 'red' }; render(); return; }
    if (MODE.i >= list.length) MODE.i = list.length - 1;
    var x = list[MODE.i];
    var html = '';
    html += '<div class="flash">';
    html += '<div class="flash-head">';
    html += '<button class="icon-btn" data-act="flash-exit" title="退出">✕</button>';
    html += '<div class="flash-title">睡前快闪</div>';
    html += '<button class="icon-btn" data-act="flash-toggle" title="播放/暂停">' + (MODE.running ? '⏸' : '▶') + '</button>';
    html += '</div>';
    html += '<div class="flash-body" data-act="flash-toggle">';
    html += '<div class="flash-word">' + esc(x.word.en) + '</div>';

    html += '<div class="flash-cn">' + esc(x.word.cn) + '</div>';
    html += '<div class="flash-unit">' + esc(unitLabel(x.unit)) + ' · 错 ' + (x.state.wrong_count || 0) + ' 次</div>';

    html += '<span>' + (MODE.i + 1) + ' / ' + list.length + ' · ' + (MODE.running ? '3 秒自动翻' : '已暂停') + '</span>';
    html += '<button class="icon-btn" data-act="flash-next">›</button>';
    html += '</div>';
    html += '</div>';
    viewEl.innerHTML = html;
    scheduleFlash();
  }

  function clearFlashTimer() {
    if (FLASH_TIMER) { clearTimeout(FLASH_TIMER); FLASH_TIMER = null; }
  }

  function scheduleFlash() {
    clearFlashTimer();
    if (MODE.name !== 'flash' || !MODE.running) return;
    FLASH_TIMER = setTimeout(function () {
      if (MODE.name !== 'flash') return;
      if (MODE.i + 1 >= (MODE.list || []).length) {
        MODE.running = false;
        MODE.i = (MODE.list || []).length - 1;
      } else {
        MODE.i++;
      }
      render();
    }, 3000);
  }

  /* ---------------- 数据操作 ---------------- */

  function exportJSON() {
    var copy = clone({ units: DATA.units, word_states: DATA.word_states, review_log: DATA.review_log, settings: DATA.settings, daily_plans: DATA.daily_plans, version: DATA.version, meta: DATA.meta, duplicates: DATA.duplicates });
    copy.exported_at = new Date().toISOString();
    download('ket-backup-' + today() + '.json', JSON.stringify(copy, null, 2), 'application/json;charset=utf-8');
    mutate(function () { DATA.last_export_at = Date.now(); });
    toast('已导出备份');
    render();
  }

  function importJSON(text) {
    var parsed;
    try { parsed = JSON.parse(text); } catch (e) { toast('这个文件不是有效的 JSON'); return; }
    if (!parsed || !Array.isArray(parsed.units) || !parsed.units.length) { toast('文件里没有单元数据'); return; }
    var words = 0;
    parsed.units.forEach(function (u) { words += (u.words || []).length; });
    var states = parsed.word_states ? Object.keys(parsed.word_states).length : 0;
    var curStates = Object.keys(DATA.word_states || {}).length;
    var risk = (states === 0 && curStates > 0)
      ? '<p class="modal-text" style="color:var(--red)">注意：文件里没有学习状态，导入后当前的 ' + curStates + ' 条进度会被清空。</p>'
      : '';
    PENDING.json = text;
    openModal(
      '<h3>导入 JSON 备份</h3>' +
      '<p class="modal-text">文件包含 ' + parsed.units.length + ' 个单元、' + words + ' 个词、' + states + ' 条学习状态。<br>导入后会覆盖当前所有数据。</p>' +
      risk +
      '<p class="modal-text tiny">当前数据会先自动存一份当天快照，导入后仍可在「恢复历史备份」里找回（快照只含学习状态，不含词表）。</p>' +
      '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-json">确认导入</button></div>'
    );
  }

  function applyJSON(text) {
    var parsed = JSON.parse(text);
    var next = normalize(parsed);
    snapshot();                                   // 先把当前状态存进当天备份
    next.backups = Object.assign({}, next.backups || {}, DATA.backups || {});
    DATA = next;
    C.applyPhonetics(DATA.units, PHON);
    buildIndex();
    save();
    closeModal();
    MODE = { name: 'home' };
    render();
    toast('备份已恢复');
  }

  function previewCSV(text, filename) {
    var res = C.parseWordsCSV(text);
    var p = res.preview;
    if (!res.units.length) {
      openModal('<h3>无法导入</h3><p class="modal-text">没有读到任何单词。</p><div class="btn-row"><button class="btn ghost" data-act="close-modal">关闭</button></div>');
      return;
    }
    var html = '<h3>导入词表预览</h3>';
    html += '<div class="preview-grid">';
    html += '<div class="pv"><b>' + p.units + '</b><span>单元</span></div>';
    html += '<div class="pv"><b>' + p.words + '</b><span>去重后单词</span></div>';
    html += '<div class="pv"><b>' + p.rows + '</b><span>读取行数</span></div>';
    html += '<div class="pv"><b>' + p.duplicates + '</b><span>合并重复</span></div>';
    html += '<div class="pv"><b>' + p.missingPhonetic + '</b><span>缺音标</span></div>';
    html += '<div class="pv"><b>' + p.missingCn + '</b><span>缺中文</span></div>';
    html += '</div>';
    if (p.warnings.length) {
      html += '<ul class="warn-list">';
      p.warnings.forEach(function (w) { html += '<li>' + esc(w) + '</li>'; });
      html += '</ul>';
    }
    html += '<p class="modal-text">导入后会替换现有词表；已经学过的词按英文单词匹配，尽量保留学习进度。</p>';
    html += '<p class="modal-text tiny">来源文件：' + esc(filename || '') + '</p>';
    html += '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-csv">确认导入</button></div>';
    PENDING.csv = text;
    openModal(html, { wide: true });
  }

  function applyCSV(text) {
    var res = C.parseWordsCSV(text);
    if (!res.units.length) { toast('没有读到单词'); return; }

    var carry = C.carryStates(DATA.units, DATA.word_states, res.units);

    snapshot();
    DATA.units = res.units.map(function (u) {
      return { unit_id: u.unit_id, title: u.title, page: u.page, order: u.order, status: 'not_started', words: u.words };
    });
    DATA.word_states = carry.states;
    DATA.meta = Object.assign({}, DATA.meta, {
      source: 'CSV 导入',
      built_at: today(),
      rows: res.preview.rows,
      unique_words: res.preview.words,
      duplicates_merged: res.preview.duplicates,
      units: res.units.length
    });
    delete DATA.daily_plans[today()];
    C.applyPhonetics(DATA.units, PHON);
    buildIndex();
    save();
    closeModal();
    MODE = { name: 'home' };
    render();
    toast('词表已导入：' + res.units.length + ' 个单元，保留 ' + carry.carried + ' 条进度');
  }

  function saveSettings() {
    var newLimit = clamp(parseInt(document.getElementById('set-new').value, 10), 0, 40);
    var revLimit = clamp(parseInt(document.getElementById('set-review').value, 10), 1, 80);
    var spellOn = !!document.getElementById('set-spell').checked;
    var spellLimit = clamp(parseInt(document.getElementById('set-spell-limit').value, 10), 0, 40);
    var spellStart = document.getElementById('set-spell-start').value;
    var spellTol = document.getElementById('set-spell-tol').value;
    var reveal = !!document.getElementById('set-reveal').checked;
    var speech = !!document.getElementById('set-speech').checked;
    mutate(function () {
      DATA.settings.daily_new_limit = newLimit;
      DATA.settings.daily_review_limit = revLimit;
      DATA.settings.spell_enabled = spellOn;
      DATA.settings.spell_daily_limit = spellLimit;
      DATA.settings.spell_start = spellStart;
      DATA.settings.spell_tolerance = spellTol;
      DATA.settings.reveal_new = reveal;
      DATA.settings.speech = speech;
    });
    var plan = planOf(today());
    if (plan && planDone(plan) === 0) {
      var prevDone = (plan.completed_words || []).slice();
      delete DATA.daily_plans[today()];
      var fresh = currentPlan();
      var ids = {};
      fresh.new_words.concat(fresh.review_words).forEach(function (id) { ids[id] = 1; });
      fresh.completed_words = prevDone.filter(function (id) { return ids[id]; });
      save();
    }
    toast('设置已保存');
    render();
  }

  function clamp(n, lo, hi) {
    if (isNaN(n)) return lo;
    return Math.max(lo, Math.min(hi, n));
  }

  function regeneratePlan() {
    openModal('<h3>重新生成今日计划？</h3><p class="modal-text">会按当前设置重新计算今天的新学和复习词。已经打过分数的词不会再出现。</p>' +
      '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-regen">重新生成</button></div>');
  }

  function doRegenerate() {
    var prevDone = ((planOf(today()) || {}).completed_words || []).slice();
    mutate(function () { delete DATA.daily_plans[today()]; });
    var plan = currentPlan();
    var ids = {};
    plan.new_words.concat(plan.review_words).forEach(function (id) { ids[id] = 1; });
    plan.completed_words = prevDone.filter(function (id) { return ids[id]; });
    plan.completed = planTotal(plan) > 0 && planDone(plan) >= planTotal(plan);
    save();
    closeModal();
    MODE = { name: 'home' };
    render();
    toast('今日计划已重新生成');
  }

  function unitLearn(unitId) {
    var unit = unitById(unitId);
    if (!unit) return;
    snapshot();
    var res = C.learnUnit(unit, DATA.word_states, today());
    DATA.word_states = res.states;
    pruneLog();
    save();
    delete DATA.daily_plans[today()];
    currentPlan();
    save();
    render();
    toast('已标记 ' + res.added + ' 个词为已学，明天开始复习');
  }

  function unitReset(unitId) {
    var unit = unitById(unitId);
    if (!unit) return;
    openModal('<h3>重置「' + esc(unit.unit_id + ' ' + unit.title) + '」？</h3><p class="modal-text">会清空这个单元所有词的学习记录（阶段、红词计数、下次复习日）。</p>' +
      '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn danger" data-act="confirm-unit-reset" data-unit="' + esc(unit.unit_id) + '">确认重置</button></div>');
  }

  function doUnitReset(unitId) {
    var unit = unitById(unitId);
    if (!unit) return;
    mutate(function () {
      unit.words.forEach(function (w) { delete DATA.word_states[w.id]; });
      delete DATA.daily_plans[today()];
    });
    currentPlan();
    save();
    closeModal();
    MODE = { name: 'parent' };
    render();
    toast('单元已重置');
  }

  function resetAll() {
    openModal('<h3>清空全部数据？</h3><p class="modal-text">会删除所有学习进度、红词、日志和备份，回到刚导入词表的状态。这个操作不能撤销，建议先导出 JSON 备份。</p>' +
      '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn danger" data-act="confirm-reset-all">确认清空</button></div>');
  }

  /** 只做字段校验/修复，不删除任何学习状态。 */
  function repairData() {
    var before = Object.keys(DATA.word_states || {}).length;
    var logBefore = DATA.review_log.length;
    DATA = normalize(DATA);
    C.applyPhonetics(DATA.units, PHON);
    buildIndex();
    currentPlan();
    pruneLog();
    save();
    var after = Object.keys(DATA.word_states || {}).length;
    render();
    toast('已校验：' + after + ' 条学习状态（修复前 ' + before + ' 条），日志 ' + logBefore + ' → ' + DATA.review_log.length + ' 条', 4000);
  }

  function doResetAll() {
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* 忽略 */ }
    DATA = normalize(clone(SEED));
    buildIndex();
    currentPlan();
    save();
    closeModal();
    MODE = { name: 'home' };
    render();
    toast('已恢复初始状态');
  }

  function openBackups() {
    var keys = Object.keys(DATA.backups || {}).sort().reverse();
    if (!keys.length) { toast('还没有自动备份'); return; }
    var html = '<h3>历史备份</h3><p class="modal-text">每天第一次操作前自动备份一次，保留最近 ' + BACKUP_KEEP + ' 天。</p><div class="backup-list">';
    keys.forEach(function (k) {
      var b = DATA.backups[k];
      var n = b.word_states ? Object.keys(b.word_states).length : 0;
      html += '<div class="backup-row"><span>' + esc(k) + '</span><span class="muted">' + n + ' 条状态</span>' +
        '<button class="mini" data-act="restore-backup" data-date="' + esc(k) + '">恢复</button></div>';
    });
    html += '</div><div class="btn-row"><button class="btn ghost" data-act="close-modal">关闭</button></div>';
    openModal(html, { wide: true });
  }

  function doRestoreBackup(date) {
    var b = DATA.backups[date];
    if (!b) return;
    snapshot();
    if (b.word_states) DATA.word_states = clone(b.word_states);
    if (b.daily_plans) DATA.daily_plans = clone(b.daily_plans);
    if (b.settings) DATA.settings = Object.assign(DATA.settings, clone(b.settings));
    delete DATA.daily_plans[today()];
    DATA = normalize(DATA);          // 备份可能是旧版本结构，这里统一修复
    C.applyPhonetics(DATA.units, PHON);
    buildIndex();
    currentPlan();
    save();
    closeModal();
    MODE = { name: 'home' };
    render();
    toast('已恢复到 ' + date + ' 的备份');
  }

  /* ---------------- 事件 ---------------- */

  function handleAction(act, el) {
    switch (act) {
      case 'start-review': startSession('review'); break;
      case 'start-new': startSession('new'); break;
      case 'exit-study': MODE = { name: 'home' }; render(); break;
      case 'go-home': MODE = { name: 'home' }; render(); break;
      case 'undo': undoLast(); break;
      case 'card-reveal':
        MODE.revealed = !MODE.revealed;
        render();
        break;
      case 'speak': speak(el.getAttribute('data-text') || ''); break;
      case 'mark': markWord(parseInt(el.getAttribute('data-r'), 10)); break;
      case 'spell-submit':
        var spellInput = document.getElementById('spell-input');
        submitSpelling(spellInput ? spellInput.value : '');
        break;
      case 'spell-skip': skipSpelling(); break;
      case 'spell-continue': spellContinue(); break;
      case 'practice-submit':
        var practiceInput = document.getElementById('practice-input');
        practiceSpelling(practiceInput ? practiceInput.value : '');
        break;
      case 'finish-day': finishDay(); break;
      case 'open-red': MODE = { name: 'red', filter: '' }; render(); break;
      case 'open-flash':
        var list = redList('');
        if (!list.length) { toast('红词本是空的'); return; }
        MODE = { name: 'flash', list: list, i: 0, running: true };
        render();
        break;
      case 'flash-toggle': MODE.running = !MODE.running; render(); break;
      case 'flash-prev':
        MODE.i = Math.max(0, MODE.i - 1); render(); break;
      case 'flash-next':
        MODE.i = Math.min(MODE.list.length - 1, MODE.i + 1); render(); break;
      case 'flash-exit': MODE = { name: 'red', filter: '' }; render(); break;
      case 'tab-home': MODE = { name: 'home' }; render(); break;
      case 'tab-red': MODE = { name: 'red', filter: '' }; render(); break;
      case 'tab-parent': MODE = { name: 'parent' }; render(); break;
      case 'tab-guide': MODE = { name: 'guide' }; render(); break;
      case 'settings-save': saveSettings(); break;
      case 'cloud-sync-now':
        if (!CLOUD.on || !CLOUD.token) { toast('当前未登录'); break; }
        toast('正在同步…', 1200);
        pushNow().then(function (ok) {
          toast(ok ? '已同步到云端' : ('同步失败：' + (CLOUD.lastError || '网络异常')), 3500);
          if (MODE.name === 'parent') render();
        });
        break;
      case 'cloud-pull-now':
        openModal('<h3>用云端进度覆盖本机？</h3><p class="modal-text">适合换了设备、本机进度是空白或偏旧的情况。本机当前进度会被云端那份替换，替换前会自动留一份当日备份。</p>' +
          '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-cloud-pull">确认覆盖</button></div>');
        break;
      case 'confirm-cloud-pull':
        closeModal();
        snapshot();
        save();
        pullReplace();
        break;
      case 'cloud-logout':
        openModal('<h3>退出登录？</h3><p class="modal-text">退出后本机进度仍然保留，但不再同步到云端；重新登录同一账号即可继续。</p>' +
          '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn danger" data-act="confirm-cloud-logout">退出登录</button></div>');
        break;
      case 'confirm-cloud-logout': cloudLogout(); break;
      case 'pwd-open': openPwdModal(); break;
      case 'pwd-save': submitPwdChange(); break;
      case 'toggle-awake': toggleAwake(); break;
      case 'regenerate-plan': regeneratePlan(); break;
      case 'confirm-regen': doRegenerate(); break;
      case 'export-json': exportJSON(); break;
      case 'import-json': pickFile('.json,application/json', importJSON); break;
      case 'import-csv': pickFile('.csv,.txt', previewCSV); break;
      case 'export-anki': download('ket-anki-' + today() + '.csv', C.exportAnkiCSV(DATA.units, DATA.word_states), 'text/csv;charset=utf-8'); toast('已导出 Anki CSV'); break;
      case 'confirm-json': applyJSON(PENDING.json || ''); break;
      case 'confirm-csv': applyCSV(PENDING.csv || ''); break;
      case 'backups-open': openBackups(); break;
      case 'connect-backup': connectBackupFolder(); break;
      case 'backup-now':
        autoBackup({ request: true, force: true }).then(function (ok) {
          toast(ok ? '已备份到文件夹（' + backupAgeText(BACKUP.lastAt) + '）' : '备份失败：请检查文件夹权限', 4000);
          render();
        });
        break;
      case 'restore-backup-folder': restoreFromFolder(); break;
      case 'disconnect-backup': disconnectBackup(); break;
      case 'confirm-restore-payload':
        var payload = PENDING.restore;
        closeModal();
        if (payload) applyRestore(payload, '手动');
        break;
      case 'restore-banner':
        ensurePermission(BACKUP.handle, true).then(function (ok) {
          if (!ok) { toast('没有拿到文件夹权限'); return; }
          return readBackupFile(BACKUP.handle, BACKUP_FILE).then(function (text) {
            var obj = JSON.parse(text);
            PENDING.restore = obj;
            showRestorePrompt(obj, '本机没有记录');
          });
        }).catch(function () { toast('没有找到备份文件'); });
        break;
      case 'open-parent': MODE = { name: 'parent' }; render(); break;
      case 'repair-data': repairData(); break;
      case 'export-unreadable':
        var unreadable = null;
        try { unreadable = window.localStorage.getItem(STORE_KEY + '_unreadable'); } catch (e) { unreadable = null; }
        if (!unreadable) { toast('没有可导出的原始数据'); break; }
        download('ket-原始数据-' + today() + '.txt', unreadable, 'text/plain;charset=utf-8');
        toast('已导出原始数据');
        break;
      case 'restore-backup':
        var date = el.getAttribute('data-date');
        openModal('<h3>恢复到 ' + esc(date) + ' 的备份？</h3><p class="modal-text">当前进度会被替换成那天的状态。</p>' +
          '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-restore" data-date="' + esc(date) + '">确认恢复</button></div>');
        break;
      case 'confirm-restore': doRestoreBackup(el.getAttribute('data-date')); break;
      case 'unit-learn': unitLearn(el.getAttribute('data-unit')); break;
      case 'unit-reset': unitReset(el.getAttribute('data-unit')); break;
      case 'confirm-unit-reset': doUnitReset(el.getAttribute('data-unit')); break;
      case 'reset-all': resetAll(); break;
      case 'confirm-reset-all': doResetAll(); break;
      case 'help': helpModal(); break;
      case 'selftest': MODE = { name: 'selftest' }; render(); break;
      case 'run-selftest': render(); break;
      case 'back-parent': MODE = { name: 'parent' }; render(); break;
      case 'close-modal': closeModal(); break;
      case 'red-filter': break;
      default: break;
    }
  }

  function updateNav() {
    var navBtns = document.querySelectorAll('.nav-btn');
    var active = 'home';
    if (MODE.name === 'red' || MODE.name === 'flash') active = 'red';
    else if (MODE.name === 'parent' || MODE.name === 'selftest') active = 'parent';
    else if (MODE.name === 'guide') active = 'guide';
    for (var i = 0; i < navBtns.length; i++) {
      navBtns[i].classList.toggle('active', navBtns[i].getAttribute('data-act') === 'tab-' + (active === 'home' ? 'home' : active));
    }
  }

  function render() {
    var t = today();
    if (app.dataset.date && app.dataset.date !== t) {
      app.dataset.date = t;
      MODE = { name: 'home' };
      UNDO = [];
    }
    clearFlashTimer();
    if (MODE.name === 'home') renderHome();
    else if (MODE.name === 'study') renderStudy();
    else if (MODE.name === 'complete') renderComplete();
    else if (MODE.name === 'red') renderRed();
    else if (MODE.name === 'flash') renderFlash();
    else if (MODE.name === 'parent') renderParent();
    else if (MODE.name === 'guide') renderGuide();
    else if (MODE.name === 'selftest') renderSelfTest();
    if (LAST_VIEW !== MODE.name) {
      LAST_VIEW = MODE.name;
      try { window.scrollTo(0, 0); } catch (e) { /* 忽略 */ }
    }
    bindSpellInputs();
    updateNav();
  }

  /* ---------------- 手机 / 平板：视口与状态栏 ---------------- */

  function initMobile() {
    var meta = document.querySelector('meta[name="theme-color"]');
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function syncTheme() {
      if (!meta) return;
      meta.setAttribute('content', (mq && mq.matches) ? '#131722' : '#4b63f0');
    }
    if (mq) {
      syncTheme();
      if (mq.addEventListener) mq.addEventListener('change', syncTheme);
      else if (mq.addListener) mq.addListener(syncTheme);
    }

    /* 屏幕键盘弹出（可视高度变小）时收起底部导航 */
    var vv = window.visualViewport;
    if (!vv) return;
    var pending = false;
    function update() {
      pending = false;
      var kb = (window.innerHeight - vv.height) > 120;
      document.body.classList.toggle('kb-open', kb);
    }
    function schedule() {
      if (pending) return;
      pending = true;
      if (window.requestAnimationFrame) window.requestAnimationFrame(update);
      else setTimeout(update, 60);
    }
    vv.addEventListener('resize', schedule);
    vv.addEventListener('scroll', schedule);
    update();
  }

  /* ---------------- 启动 ---------------- */

  function startApp() {
    if (CLOUD.booted) { render(); return; }
    CLOUD.booted = true;
    probeStorage();
    /* 「使用说明」页签只在分享版出现，主版保持原来的三个页签 */
    if (!DIST) {
      var guideTab = document.querySelector('.nav-btn[data-act="tab-guide"]');
      if (guideTab) guideTab.remove();
    }
    DATA = loadData();
    C.applyPhonetics(DATA.units, PHON);
    buildIndex();
    snapshot();
    currentPlan();
    pruneLog();
    save();
    app.dataset.date = today();
    initBackup();
    var hash = String(window.location.hash || '').toLowerCase();
    if (hash === '#parent') MODE = { name: 'parent' };
    else if (hash === '#red') MODE = { name: 'red', filter: '' };
    else if (hash === '#selftest') MODE = { name: 'selftest' };
    else if (hash === '#guide') MODE = { name: 'guide' };
    else if (hash === '#study') startSession('review');
    render();
    initMobile();
    applyWake();
    if (RECOVERY) toast('本地数据读取失败，已保留原始副本。请到家长页导出它，或导入最近一次 JSON 备份。', 7000);

    /* 云端还没有这个账号的进度、或本机比云端新：把本机进度推上去 */
    if (CLOUD.on && CLOUD.token && CLOUD.pendingUpload) {
      CLOUD.pendingUpload = false;
      pushNow();
    }

    document.addEventListener('click', function (e) {
      var target = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!target) return;
      var act = target.getAttribute('data-act');
      if (target.tagName === 'SELECT') return;
      if (target.classList.contains('modal-backdrop')) return;
      handleAction(act, target);
    });

    modalEl.addEventListener('click', function (e) {
      if (e.target === modalEl) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      if (modalEl.classList.contains('open')) {
        if (e.key === 'Escape') closeModal();
        return;
      }
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
        if (e.key === 'Escape' && MODE.name === 'study') { MODE = { name: 'home' }; render(); }
        return;
      }
      if (MODE.name !== 'study') {
        if (e.key === 'Escape' && MODE.name !== 'home') { MODE = { name: 'home' }; render(); }
        return;
      }
      var card = currentCard();
      var isSpell = card && card.dir === C.TRACK_SPELL;
      if (isSpell) {
        if (e.key === 'Enter' && MODE.phase === 'feedback') { e.preventDefault(); spellContinue(); }
        else if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); undoLast(); }
        else if (e.key === 'Escape') { MODE = { name: 'home' }; render(); }
        return;
      }
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        MODE.revealed = !MODE.revealed;
        render();
      } else if (e.key === '1' || e.key === '2' || e.key === '3') {
        markWord(parseInt(e.key, 10) - 1);
      } else if (e.key === 'Backspace' || e.key === 'ArrowLeft') {
        e.preventDefault();
        undoLast();
      } else if (e.key === 'Escape') {
        MODE = { name: 'home' };
        render();
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { releaseWake(); autoBackup(); return; }
      applyWake();
      if (MODE.name === 'study' || MODE.name === 'flash') return;
      if (app.dataset.date !== today()) {
        app.dataset.date = today();
        MODE = { name: 'home' };
        render();
      }
    });

    window.addEventListener('pagehide', function () { autoBackup(); });

    /* 另一个窗口也在改数据时：忙碌时只提醒，空闲时直接同步，避免互相覆盖 */
    window.addEventListener('storage', function (e) {
      if (!e || e.key !== STORE_KEY || !e.newValue) return;
      var incoming;
      try { incoming = normalize(JSON.parse(e.newValue)); } catch (err) { return; }
      if (MODE.name === 'study' || MODE.name === 'flash' || MODE.name === 'complete') {
        toast('另一个窗口也在记单词，请只保留一个窗口，避免两边互相覆盖', 4500);
        return;
      }
      DATA = incoming;
      buildIndex();
      render();
      toast('已同步另一个窗口的数据');
    });

    if (/[?&]test=1(?:&|$)/.test(String(window.location.search || ''))) {
      window.__KET__ = {
        data: function () { return DATA; },
        applyCSV: applyCSV,
        applyJSON: applyJSON,
        doResetAll: doResetAll,
        doUnitReset: doUnitReset,
        doRestoreBackup: doRestoreBackup,
        currentPlan: currentPlan,
        repairData: repairData,
        useMemoryBackup: function () {
          BACKUP.handle = memoryBackupHandle();
          BACKUP.permission = 'granted';
          return true;
        },
        backupNow: function () { return autoBackup({ request: true, force: true }); },
        readBackupText: function () { return readBackupFile(BACKUP.handle, BACKUP_FILE); },
        restorePayload: function (obj) { applyRestore(obj, '测试'); return true; },
        simulateClearedBoot: function () {
          try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* 忽略 */ }
          HAD_LOCAL = false;
          DATA = normalize(clone(SEED));
          buildIndex();
          return readBackupFile(BACKUP.handle, BACKUP_FILE).then(function (text) {
            var obj = JSON.parse(text);
            var d = backupDecision(obj);
            if (d.action === 'restore') applyRestore(obj, d.reason);
            return d;
          });
        },
        backupInfo: function () {
          return { connected: !!BACKUP.handle, permission: BACKUP.permission, lastAt: BACKUP.lastAt, files: BACKUP.handle && BACKUP.handle._files ? Object.keys(BACKUP.handle._files) : [] };
        },
        exportAnkiCSV: function () { return C.exportAnkiCSV(DATA.units, DATA.word_states); }
      };
    }
  }

  /* 未配置云函数地址时（本地双击打开调试），直接进本机模式 */
  function start() {
    if (!API_BASE) {
      CLOUD.on = false;
      startApp();
      return;
    }
    CLOUD.on = true;
    CLOUD.token = readToken();
    CLOUD.user = readUser();
    if (!CLOUD.token) {
      showGate(inviteFromUrl() ? 'reg' : 'login');
      return;
    }
    showGate('loading');
    pullCloud().then(function () {
      if (!CLOUD.token) {
        showGate('login', '登录已过期，请重新登录');
        return;
      }
      hideGate();
      startApp();
      if (CLOUD.syncState === 'offline') {
        toast('暂时连不上云端，先用本机数据，网络恢复后会自动同步', 5000);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
